<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows 11 Web Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        body, html {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Yu Gothic UI", "Meiryo", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* Off-line safe Desktop Icon Grid Layout */
        #desktop-icons {
            display: grid;
            grid-auto-flow: column;
            grid-template-rows: repeat(6, 5.5rem);
            gap: 0.5rem;
            padding: 0.75rem;
            width: fit-content;
            height: calc(100vh - 48px);
            align-content: start;
        }
        .desktop-icon {
            width: 5rem;
            height: 5.5rem;
        }

        /* Default Windows 11 Bloom-inspired Wallpaper (Pure CSS/SVG) */
        .wallpaper-bloom {
            background-image: url('https://lh3.googleusercontent.com/drive-storage/AJQWtBNgcBkJsbl1N91VXMpxjifvCbaooCOEkIV39ot9uyZDDyCEQ9shUVF9nCq4Fbkb9eZ9Xk2-nRpyXRmaOAk4lqxUQ_xqjGABSw31zDIqAd0A_ZIU=w1365-h644?auditContext=forDisplay'),
                              radial-gradient(circle at 20% 20%, #0078d4 0%, transparent 50%),
                              radial-gradient(circle at 80% 80%, #00b7c3 0%, transparent 50%),
                              radial-gradient(circle at 50% 50%, #0f172a 0%, #020617 100%);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #091326;
        }

        .wallpaper-sunset {
            background: linear-gradient(135deg, #ff7e5f 0%, #feb47b 40%, #6a11cb 85%, #2575fc 100%);
        }

        .wallpaper-mint {
            background: radial-gradient(circle at 10% 90%, #10b981 0%, transparent 55%),
                        radial-gradient(circle at 90% 10%, #3b82f6 0%, transparent 55%),
                        #064e3b;
        }

        .wallpaper-dark {
            background: radial-gradient(circle at 50% 30%, #1e293b 0%, #090d16 70%, #000000 100%);
        }

        .wallpaper-custom {
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #091326;
        }

        /* Mica / Acrylic Glassmorphism Effects */
        .mica-light {
            background: rgba(243, 243, 243, 0.82);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .mica-dark {
            background: rgba(32, 32, 32, 0.82);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #ffffff;
        }

        /* Window Transitions & Shadows */
        .win-window {
            position: absolute;
            border-radius: 8px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35), 0 0 1px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: transform 0.18s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.18s ease, width 0.2s ease, height 0.2s ease, top 0.2s ease, left 0.2s ease;
        }

        .win-window.dragging {
            transition: none !important;
        }

        .win-window.minimized {
            transform: scale(0.85) translateY(150px);
            opacity: 0;
            pointer-events: none;
        }

        .win-window.maximized {
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: calc(100vh - 48px) !important;
            border-radius: 0 !important;
        }

        /* Resize Handles */
        .win-resize-handle {
            position: absolute;
            z-index: 30;
        }
        .win-resize-n { top: -3px; left: 8px; right: 8px; height: 6px; cursor: ns-resize; }
        .win-resize-s { bottom: -3px; left: 8px; right: 8px; height: 6px; cursor: ns-resize; }
        .win-resize-w { left: -3px; top: 8px; bottom: 8px; width: 6px; cursor: ew-resize; }
        .win-resize-e { right: -3px; top: 8px; bottom: 8px; width: 6px; cursor: ew-resize; }
        .win-resize-nw { top: -4px; left: -4px; width: 12px; height: 12px; cursor: nwse-resize; }
        .win-resize-ne { top: -4px; right: -4px; width: 12px; height: 12px; cursor: nesw-resize; }
        .win-resize-sw { bottom: -4px; left: -4px; width: 12px; height: 12px; cursor: nesw-resize; }
        .win-resize-se { bottom: -4px; right: -4px; width: 14px; height: 14px; cursor: nwse-resize; }

        /* Start Menu & Flyouts Animation */
        .flyout-panel {
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.2s ease;
        }

        .flyout-hidden {
            transform: translateY(24px) scale(0.97);
            opacity: 0;
            pointer-events: none;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.5);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(156, 163, 175, 0.8);
        }

        /* Desktop Icon Hover */
        .desktop-icon:hover {
            background-color: rgba(255, 255, 255, 0.14);
            border: 1px solid rgba(255, 255, 255, 0.22);
        }
        .desktop-icon:active {
            background-color: rgba(255, 255, 255, 0.22);
            transform: scale(0.97);
        }

        /* Taskbar Running Indicator Pill */
        .tb-indicator {
            position: absolute;
            bottom: 3px;
            left: 50%;
            transform: translateX(-50%);
            height: 3px;
            border-radius: 9999px;
            transition: width 0.2s ease, background-color 0.2s ease, opacity 0.2s ease;
        }
        .tb-indicator-hidden {
            width: 0px;
            opacity: 0;
        }
        .tb-indicator-open {
            width: 6px;
            background-color: #64748b;
            opacity: 1;
        }
        .tb-indicator-active {
            width: 16px;
            background-color: #0078d4;
            opacity: 1;
        }
    </style>
</head>
<body class="wallpaper-bloom relative w-screen h-screen overflow-hidden select-none" id="desktop-bg" oncontextmenu="showContextMenu(event)">

    <!-- Decorative SVG Bloom Ribbon in Center (Hidden by default when custom photo wallpaper is active) -->
    <div id="bloom-svg" class="pointer-events-none absolute inset-0 hidden items-center justify-center opacity-85">
        <svg viewBox="0 0 800 600" class="w-[85vw] max-w-[900px] h-auto drop-shadow-2xl">
            <defs>
                <linearGradient id="bloomGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
                    <stop offset="50%" stop-color="#2563eb" stop-opacity="0.85"/>
                    <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0.9"/>
                </linearGradient>
                <linearGradient id="bloomGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.85"/>
                    <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.75"/>
                    <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.9"/>
                </linearGradient>
            </defs>
            <path d="M400,120 C520,120 620,210 590,320 C560,430 430,480 320,440 C210,400 180,270 250,190 C300,130 350,120 400,120 Z" fill="url(#bloomGrad1)"/>
            <path d="M420,160 C510,180 560,280 510,360 C460,440 340,450 280,380 C220,310 260,210 340,170 C370,155 400,155 420,160 Z" fill="url(#bloomGrad2)" transform="rotate(25 400 300)"/>
            <path d="M390,190 C470,200 510,270 470,340 C430,410 340,410 300,350 C260,290 300,210 360,195 Z" fill="#93c5fd" opacity="0.45" transform="rotate(-15 400 300)"/>
        </svg>
    </div>

    <!-- Desktop Icons Area -->
    <div id="desktop-icons" class="relative z-10 p-3 grid grid-flow-col grid-rows-6 gap-2 w-fit h-[calc(100vh-48px)]" oncontextmenu="showContextMenu(event)">
        <!-- PC / Explorer -->
        <button id="desk-icon-explorer" onclick="openApp('explorer')" oncontextmenu="showItemContextMenu(event, 'desk-icon-explorer', 'PC', false, 'explorer')" class="desktop-icon w-20 h-22 p-2 rounded flex flex-col items-center justify-center text-white text-center border border-transparent transition cursor-pointer">
            <img src="https://lh3.googleusercontent.com/drive-storage/AJQWtBMPhIy7w05JvclsPTvOoV3_JUxvUk7IePx1I02AiFR6TrZMH2CPiJPTCeeIRBe2iFejwmmH464ORR-9ODNDfWMyQ0ixVgm92T0p77EXxtT7NP6e=w1365-h644?auditContext=forDisplay" onerror="this.onerror=null;this.src='https://placehold.co/44x44/0284c7/ffffff?text=PC';" class="w-11 h-11 mb-1 rounded-lg object-contain drop-shadow-md" alt="PC">
            <span class="text-xs drop-shadow-[0_1px_2px_rgba(0,0,0,0.9)] leading-tight">PC</span>
        </button>

        <!-- Recycle Bin -->
        <button id="desk-icon-trash" onclick="showNotification('ごみ箱', 'ごみ箱は空です。')" oncontextmenu="showItemContextMenu(event, 'desk-icon-trash', 'ごみ箱', false)" class="desktop-icon w-20 h-22 p-2 rounded flex flex-col items-center justify-center text-white text-center border border-transparent transition cursor-pointer">
            <img src="https://lh3.googleusercontent.com/drive-storage/AJQWtBMUtdtqjyW0OpyeaY4S0MjFeCIYJj3bJi_Lno9ZNOCs1tVUTj9UE90STiJheGeikjM4TXcBSTiZWp2Ijjih_BZ6ObuxD0slzW2DzWNxJaqvx0aABg=w1365-h644?auditContext=forDisplay" onerror="this.onerror=null;this.src='https://placehold.co/44x44/64748b/ffffff?text=Trash';" class="w-11 h-11 mb-1 rounded-lg object-contain drop-shadow-md" alt="ごみ箱">
            <span class="text-xs drop-shadow-[0_1px_2px_rgba(0,0,0,0.9)] leading-tight">ごみ箱</span>
        </button>

        <!-- Google Chrome -->
        <button id="desk-icon-browser" onclick="openApp('browser')" oncontextmenu="showItemContextMenu(event, 'desk-icon-browser', 'Google Chrome', true, 'browser')" class="desktop-icon w-20 h-22 p-2 rounded flex flex-col items-center justify-center text-white text-center border border-transparent transition cursor-pointer">
            <div class="w-11 h-11 mb-1 rounded-lg overflow-hidden flex items-center justify-center drop-shadow-md">
                <img src="https://lh3.googleusercontent.com/drive-storage/AJQWtBPG9uHLLKG_Pysd9s2p6BgGlsQNUqJRXi5lQkD-F9oiBOxkN1v_cZQuS0VtFqCkLiYsGwsuMlP7ETyBgNQvOo0pkLFt-iE9L_3HfCv8e1WZutr_pQ=w1365-h644?auditContext=forDisplay" onerror="this.onerror=null;this.src='https://placehold.co/44x44/2563eb/ffffff?text=C';" class="w-full h-full object-cover scale-[1.45]" alt="Google Chrome">
            </div>
            <span class="text-xs drop-shadow-[0_1px_2px_rgba(0,0,0,0.9)] leading-tight">Google Chrome</span>
        </button>

        <!-- Notepad -->
        <button id="desk-icon-notepad" onclick="openApp('notepad')" oncontextmenu="showItemContextMenu(event, 'desk-icon-notepad', 'メモ帳', true, 'notepad')" class="desktop-icon w-20 h-22 p-2 rounded flex flex-col items-center justify-center text-white text-center border border-transparent transition cursor-pointer">
            <img src="https://lh3.googleusercontent.com/drive-storage/AJQWtBPTu2Mno-4UvHbW4ZIcEh2N6zwazdpLm5clX8uy9UOezWb7tb3GimK7h7RPDWb8bUKXOmzTHC-_gKwHiaUA9mH78KQ0FoJOtiOkblGe51Zvdq4-Kg=w1365-h644?auditContext=forDisplay" onerror="this.onerror=null;this.src='https://placehold.co/44x44/0ea5e9/ffffff?text=Note';" class="w-11 h-11 mb-1 rounded-lg object-contain drop-shadow-md" alt="メモ帳">
            <span class="text-xs drop-shadow-[0_1px_2px_rgba(0,0,0,0.9)] leading-tight">メモ帳</span>
        </button>

        <!-- Calculator -->
        <button id="desk-icon-calculator" onclick="openApp('calculator')" oncontextmenu="showItemContextMenu(event, 'desk-icon-calculator', '電卓', true, 'calculator')" class="desktop-icon w-20 h-22 p-2 rounded flex flex-col items-center justify-center text-white text-center border border-transparent transition cursor-pointer">
            <img src="https://lh3.googleusercontent.com/drive-storage/AJQWtBNkEKwk4zjPkXzhr5f8N1tURzqrnrJNLWDUkDScgIdPotPE57VFIBN27_tavKA5Gnjw2LrZry2HqxqaiBCVZLp8IeAsXGSKwHT451_L4o6wIHdqBA=w1365-h644?auditContext=forDisplay" onerror="this.onerror=null;this.src='https://placehold.co/44x44/4f46e5/ffffff?text=Calc';" class="w-11 h-11 mb-1 rounded-lg object-contain drop-shadow-md" alt="電卓">
            <span class="text-xs drop-shadow-[0_1px_2px_rgba(0,0,0,0.9)] leading-tight">電卓</span>
        </button>

        <!-- Settings -->
        <button id="desk-icon-settings" onclick="openApp('settings')" oncontextmenu="showItemContextMenu(event, 'desk-icon-settings', '設定', false, 'settings')" class="desktop-icon w-20 h-22 p-2 rounded flex flex-col items-center justify-center text-white text-center border border-transparent transition cursor-pointer">
            <img src="https://lh3.googleusercontent.com/drive-storage/AJQWtBNvpz0vQzlgi9HhqPEVz-U7-K276Tor5LX1Ocy5p_EbLqHzzLhIIoOscCWvsX5j4xY_FAzhPVos_I9fT57Gv88YrVg_pZZXjjmqG9RGfDokgToU5g=w1365-h644?auditContext=forDisplay" onerror="this.onerror=null;this.src='https://placehold.co/44x44/475569/ffffff?text=Set';" class="w-11 h-11 mb-1 rounded-lg object-contain drop-shadow-md" alt="設定">
            <span class="text-xs drop-shadow-[0_1px_2px_rgba(0,0,0,0.9)] leading-tight">設定</span>
        </button>

        <!-- ShadowCapture Pro (Simulator Highlights Recorder) -->
        <button id="desk-icon-recorder" onclick="openApp('recorder')" oncontextmenu="showItemContextMenu(event, 'desk-icon-recorder', 'ShadowCapture Pro', false, 'recorder')" class="desktop-icon w-20 h-22 p-2 rounded flex flex-col items-center justify-center text-white text-center border border-transparent transition cursor-pointer">
            <div class="w-11 h-11 mb-1 rounded-lg bg-gradient-to-br from-emerald-500 via-teal-600 to-slate-900 flex items-center justify-center shadow-md border border-emerald-300/40 relative">
                <i class="ph-fill ph-record text-2xl text-emerald-300"></i>
                <span class="absolute -top-1 -right-1 w-3 h-3 rounded-full bg-red-500 border border-white"></span>
            </div>
            <span class="text-xs drop-shadow-[0_1px_2px_rgba(0,0,0,0.9)] leading-tight">ShadowCapture</span>
        </button>

        <!-- Microsoft Store -->
        <button id="desk-icon-store" onclick="openApp('store')" oncontextmenu="showItemContextMenu(event, 'desk-icon-store', 'Microsoft Store', false, 'store')" class="desktop-icon w-20 h-22 p-2 rounded flex flex-col items-center justify-center text-white text-center border border-transparent transition cursor-pointer">
            <img src="https://lh3.googleusercontent.com/drive-storage/AJQWtBNPMzzJNAfxkK1Q3LFt0YfFAmNImVp0MKqM5sVleZtlEYINGHg0vBV2OrPbEqRvRQPzT9uFXZGe0snf4Fs_iRFxy4mrCK4Ng-cNPHBhs5aw5ihi_g=w1365-h644?auditContext=forDisplay" onerror="this.onerror=null;this.src='https://placehold.co/44x44/2563eb/ffffff?text=Store';" class="w-11 h-11 mb-1 rounded-lg object-contain drop-shadow-md" alt="Microsoft Store">
            <span class="text-xs drop-shadow-[0_1px_2px_rgba(0,0,0,0.9)] leading-tight">Microsoft Store</span>
        </button>
    </div>

    <!-- Windows Container -->
    <div id="windows-container" class="absolute inset-0 pointer-events-none z-20"></div>

    <!-- Desktop Right-Click Context Menu -->
    <div id="context-menu" class="hidden fixed z-50 w-60 mica-light rounded-lg shadow-2xl py-1.5 text-sm text-slate-800 border border-white/60">
        <button onclick="refreshDesktop()" class="w-full px-3 py-1.5 text-left hover:bg-black/5 flex items-center gap-2.5">
            <i class="ph ph-arrows-clockwise text-base text-slate-600"></i> 最新の情報に更新
        </button>
        <div class="my-1 border-t border-black/10"></div>
        <button onclick="promptCreateFolder()" class="w-full px-3 py-1.5 text-left hover:bg-black/5 flex items-center gap-2.5">
            <i class="ph-fill ph-folder-plus text-base text-amber-500"></i> 新規フォルダーを追加
        </button>
        <button onclick="openApp('notepad'); hideContextMenu()" class="w-full px-3 py-1.5 text-left hover:bg-black/5 flex items-center gap-2.5">
            <i class="ph ph-file-plus text-base text-blue-600"></i> 新規テキスト ドキュメント
        </button>
        <button onclick="cycleWallpaper()" class="w-full px-3 py-1.5 text-left hover:bg-black/5 flex items-center gap-2.5">
            <i class="ph ph-image text-base text-purple-600"></i> 次のデスクトップ背景
        </button>
        <div class="my-1 border-t border-black/10"></div>
        <button onclick="openApp('settings'); hideContextMenu()" class="w-full px-3 py-1.5 text-left hover:bg-black/5 flex items-center gap-2.5">
            <i class="ph ph-paint-brush text-base text-sky-600"></i> 個人用設定（壁紙の追加）
        </button>
    </div>

    <!-- Desktop Item Right-Click Context Menu -->
    <div id="item-context-menu" class="hidden fixed z-50 w-56 mica-light rounded-lg shadow-2xl py-1.5 text-sm text-slate-800 border border-white/60">
        <div id="item-ctx-title" class="px-3 py-1 text-xs font-bold text-slate-500 truncate border-b border-black/10 mb-1">アイテム</div>
        <button id="item-ctx-open" class="w-full px-3 py-1.5 text-left hover:bg-black/5 flex items-center gap-2.5">
            <i class="ph ph-arrow-square-out text-base text-blue-600"></i> 開く
        </button>
        <button id="item-ctx-pin" class="hidden w-full px-3 py-1.5 text-left hover:bg-black/5 flex items-center gap-2.5">
            <i class="ph ph-push-pin text-base text-sky-600"></i> タスクバーにピン留めする
        </button>
        <button id="item-ctx-rename" class="hidden w-full px-3 py-1.5 text-left hover:bg-black/5 flex items-center gap-2.5">
            <i class="ph ph-pencil-simple text-base text-slate-600"></i> 名前の変更
        </button>
        <button id="item-ctx-delete" class="w-full px-3 py-1.5 text-left hover:bg-red-500/10 text-red-600 flex items-center gap-2.5">
            <i class="ph ph-trash text-base"></i> アプリ / アイコンを削除
        </button>
    </div>

    <!-- Taskbar App Right-Click Context Menu -->
    <div id="tb-app-context-menu" class="hidden fixed z-50 w-60 mica-light rounded-lg shadow-2xl py-1.5 text-sm text-slate-800 border border-white/60">
        <div id="tb-ctx-title" class="px-3 py-1 text-xs font-bold text-slate-500 truncate border-b border-black/10 mb-1">アプリ</div>
        <button id="tb-ctx-toggle-pin" class="w-full px-3 py-1.5 text-left hover:bg-black/5 flex items-center gap-2.5">
            <i class="ph ph-push-pin text-base text-blue-600"></i> <span id="tb-ctx-pin-label">タスクバーにピン留めする</span>
        </button>
        <button id="tb-ctx-close" class="hidden w-full px-3 py-1.5 text-left hover:bg-red-500/10 text-red-600 flex items-center gap-2.5">
            <i class="ph ph-x-circle text-base"></i> ウィンドウを閉じる
        </button>
    </div>

    <!-- Taskbar Right-Click Context Menu -->
    <div id="taskbar-context-menu" class="hidden fixed z-50 w-60 mica-light rounded-lg shadow-2xl py-1.5 text-sm text-slate-800 border border-white/60">
        <button onclick="minimizeAllWindows(); hideContextMenu()" class="w-full px-3 py-1.5 text-left hover:bg-black/5 flex items-center gap-2.5">
            <i class="ph ph-desktop text-base text-blue-600"></i> デスクトップの表示
        </button>
        <button onclick="openApp('terminal'); hideContextMenu()" class="w-full px-3 py-1.5 text-left hover:bg-black/5 flex items-center gap-2.5">
            <i class="ph-bold ph-terminal-window text-base text-slate-700"></i> ターミナルを開く
        </button>
        <div class="my-1 border-t border-black/10"></div>
        <button onclick="openApp('settings'); hideContextMenu()" class="w-full px-3 py-1.5 text-left hover:bg-black/5 flex items-center gap-2.5">
            <i class="ph ph-gear text-base text-slate-600"></i> タスクバーの設定
        </button>
    </div>

    <!-- Custom Modal Dialog (For Folder Creation / Rename without prompt()) -->
    <div id="os-modal-backdrop" class="hidden fixed inset-0 z-50 bg-black/40 backdrop-blur-xs flex items-center justify-center p-4">
        <div class="w-full max-w-sm mica-light rounded-xl shadow-2xl p-5 border border-white/70 text-slate-800">
            <h3 id="os-modal-title" class="text-sm font-bold mb-1">新規フォルダーの作成</h3>
            <p id="os-modal-desc" class="text-xs text-slate-600 mb-3">フォルダー名を入力してください。</p>
            <input id="os-modal-input" type="text" class="w-full px-3 py-2 rounded-lg bg-white border border-slate-300 text-sm focus:outline-none focus:border-blue-500 mb-4">
            <div class="flex justify-end gap-2">
                <button onclick="closeOsModal()" class="px-3.5 py-1.5 rounded-lg bg-slate-200 hover:bg-slate-300 text-xs font-medium transition">キャンセル</button>
                <button id="os-modal-confirm" class="px-4 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold transition">OK</button>
            </div>
        </div>
    </div>

    <!-- Start Menu -->
    <div id="start-menu" class="flyout-panel flyout-hidden fixed bottom-14 left-1/2 -translate-x-1/2 w-[94vw] max-w-[600px] mica-light rounded-xl shadow-2xl z-40 overflow-hidden flex flex-col border border-white/60">
        <div class="p-6 pb-4">
            <!-- Search Bar inside Start -->

        // --- IndexedDB for Large Custom Minecraft HTML Files ---
        const MC_DB_NAME = 'win11_mc_html_db';
        const MC_STORE_NAME = 'html_files';

        function openMcHtmlDb() {
            return new Promise((resolve, reject) => {
                if (!window.indexedDB) return reject(new Error('IndexedDB unavailable'));
                const req = indexedDB.open(MC_DB_NAME, 1);
                req.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(MC_STORE_NAME)) {
                        db.createObjectStore(MC_STORE_NAME);
                    }
                };
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        async function saveMcHtmlToDb(id, htmlText) {
            try {
                const db = await openMcHtmlDb();
                return new Promise((resolve) => {
                    const tx = db.transaction(MC_STORE_NAME, 'readwrite');
                    tx.objectStore(MC_STORE_NAME).put(htmlText, id);
                    tx.oncomplete = () => resolve(true);
                    tx.onerror = () => resolve(false);
                });
            } catch {
                return false;
            }
        }

        async function getMcHtmlFromDb(id) {
            try {
                const db = await openMcHtmlDb();
                return new Promise((resolve) => {
                    const tx = db.transaction(MC_STORE_NAME, 'readonly');
                    const req = tx.objectStore(MC_STORE_NAME).get(id);
                    req.onsuccess = () => resolve(req.result || null);
                    req.onerror = () => resolve(null);
                });
            } catch {
                return null;
            }
        }

        async function deleteMcHtmlFromDb(id) {
            try {
                const db = await openMcHtmlDb();
                const tx = db.transaction(MC_STORE_NAME, 'readwrite');
                tx.objectStore(MC_STORE_NAME).delete(id);
            } catch {}
        }

                    if (typeof state.savedNotepadText === 'string') savedNotepadText = state.savedNotepadText;

                    if (state.savedWallpaper) {

            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const dateStr = `${year}/${month}/${day}`;

            document.getElementById('taskbar-time').textContent = timeStr;
            document.getElementById('taskbar-date').textContent = dateStr;
            document.getElementById('lock-time').textContent = timeStr;
            document.getElementById('lock-date').textContent = now.toLocaleDateString('ja-JP', {

            if (calHeaderDate) {

                });
            }
            if (calHeaderTime) {
                calHeaderTime.textContent = `${timeStr}:${seconds}`;
            }
        }

        function renderCalendarGrid() {
            const labelEl = document.getElementById('cal-month-label');
            const gridEl = document.getElementById('cal-days-grid');
            if (!labelEl || !gridEl) return;

            labelEl.textContent = `${calViewYear}年 ${calViewMonth + 1}月`;

            const today = new Date();
            const isCurrentMonth = today.getFullYear() === calViewYear && today.getMonth() === calViewMonth;
            const todayDate = today.getDate();

            const firstDay = new Date(calViewYear, calViewMonth, 1).getDay();
            const daysInMonth = new Date(calViewYear, calViewMonth + 1, 0).getDate();
            const prevMonthDays = new Date(calViewYear, calViewMonth, 0).getDate();

            let cells = '';
            for (let i = firstDay - 1; i >= 0; i--) {
                cells += `<div class="h-8 flex items-center justify-center text-slate-400 text-[11px]">${prevMonthDays - i}</div>`;
            }
            for (let d = 1; d <= daysInMonth; d++) {
                const isToday = isCurrentMonth && d === todayDate;
                const dayOfWeek = (firstDay + d - 1) % 7;
                const colorCls = isToday
                    ? 'bg-blue-600 text-white font-bold shadow-sm'
                    : (dayOfWeek === 0 ? 'text-red-600 hover:bg-black/5' : (dayOfWeek === 6 ? 'text-blue-600 hover:bg-black/5' : 'text-slate-800 hover:bg-black/5'));
                cells += `<button onclick="showNotification('カレンダー', '${calViewYear}年${calViewMonth + 1}月${d}日')" class="h-8 rounded-full flex items-center justify-center transition ${colorCls}">${d}</button>`;
            }
            const totalCells = firstDay + daysInMonth;
            const remaining = (7 - (totalCells % 7)) % 7;
            for (let n = 1; n <= remaining; n++) {
                cells += `<div class="h-8 flex items-center justify-center text-slate-400 text-[11px]">${n}</div>`;
            }
            gridEl.innerHTML = cells;
        }

        function changeCalendarMonth(delta) {
            calViewMonth += delta;
            if (calViewMonth < 0) {
                calViewMonth = 11;
                calViewYear--;
            } else if (calViewMonth > 11) {
                calViewMonth = 0;
                calViewYear++;
            }
            renderCalendarGrid();
        }

        function resetCalendarToToday() {
            const now = new Date();
            calViewYear = now.getFullYear();
            calViewMonth = now.getMonth();

        }

            if (willOpen) {
                renderCalendarGrid();
                cal.classList.remove('flyout-hidden');
            } else {
                cal.classList.add('flyout-hidden');
            }
        }

        // --- Real Hardware Battery, Wi-Fi & Bluetooth Detection ---
        let connectedBtDevices = [];
        let detectedMouseName = null;
        let detectedControllers = [];
        let realBatteryInfo = { supported: false, level: 94, charging: true };

        function updateBatteryStatusUI(battery) {
            const pct = Math.round((battery ? battery.level : realBatteryInfo.level / 100) * 100);
            const charging = battery ? battery.charging : realBatteryInfo.charging;
            realBatteryInfo = { supported: !!battery, level: pct, charging };

            const trayWrap = document.getElementById('tray-battery-wrap');
            const trayIcon = document.getElementById('tray-battery-icon');
            const trayPct = document.getElementById('tray-battery-pct');
            const qsText = document.getElementById('qs-battery-text');

            let iconClass = 'ph-battery-high';
            if (charging) {
                iconClass = 'ph-battery-charging';
            } else if (pct <= 15) {
                iconClass = 'ph-battery-warning';
            } else if (pct <= 40) {
                iconClass = 'ph-battery-low';
            } else if (pct <= 75) {
                iconClass = 'ph-battery-medium';
            } else {
                iconClass = 'ph-battery-full';
            }

            if (trayIcon) {
                trayIcon.className = `ph ${iconClass} text-base ${charging ? 'text-emerald-600' : (pct <= 15 ? 'text-red-600' : '')}`;
            }
            if (trayPct) trayPct.textContent = `${pct}%`;
            if (trayWrap) trayWrap.title = `バッテリー: ${pct}%${charging ? ' (充電中)' : ' (バッテリー駆動)'}`;
            if (qsText) {
                qsText.innerHTML = `<i class="ph-fill ${iconClass} ${charging ? 'text-emerald-600' : (pct <= 15 ? 'text-red-600' : 'text-slate-700')} text-base"></i> ${pct}%${charging ? ' (充電中)' : ''}`;
            }
        }

        if (navigator.getBattery) {
            navigator.getBattery().then((battery) => {
                updateBatteryStatusUI(battery);
                battery.addEventListener('levelchange', () => updateBatteryStatusUI(battery));
                battery.addEventListener('chargingchange', () => updateBatteryStatusUI(battery));
            }).catch(() => updateBatteryStatusUI(null));
        } else {
            updateBatteryStatusUI(null);
        }

        function checkRealNetworkStatus(notifyUser = false) {
            const isOnline = navigator.onLine;
            const trayWifi = document.getElementById('tray-wifi-icon');
            const qsWifiBtn = document.getElementById('qs-wifi-btn');
            const qsWifiIcon = document.getElementById('qs-wifi-icon');
            const qsWifiLabel = document.getElementById('qs-wifi-label');

            if (isOnline) {
                const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
                let netLabel = 'Wi-Fi 接続済み';
                if (conn) {
                    if (conn.type === 'ethernet') {
                        netLabel = 'イーサネット (有線)';
                    } else if (conn.effectiveType) {
                        const speed = conn.downlink ? ` · ${conn.downlink}Mbps` : '';
                        netLabel = `Wi-Fi (${conn.effectiveType.toUpperCase()}${speed})`;
                    }
                }
                if (trayWifi) {
                    trayWifi.className = 'ph ph-wifi-high text-base text-slate-700';
                    trayWifi.title = `${netLabel} - インターネットアクセス`;
                }
                if (qsWifiBtn) {
                    qsWifiBtn.classList.add('bg-blue-600', 'text-white');
                    qsWifiBtn.classList.remove('bg-white/70', 'text-slate-800');
                }
                if (qsWifiIcon) qsWifiIcon.className = 'ph-bold ph-wifi-high text-lg';
                if (qsWifiLabel) qsWifiLabel.textContent = netLabel;
                if (notifyUser) showNotification('ネットワーク状態', `${netLabel} に接続されています。`);
            } else {
                if (trayWifi) {
                    trayWifi.className = 'ph ph-wifi-slash text-base text-red-600';
                    trayWifi.title = 'インターネット未接続（オフライン）';
                }
                if (qsWifiBtn) {
                    qsWifiBtn.classList.remove('bg-blue-600', 'text-white');
                    qsWifiBtn.classList.add('bg-white/70', 'text-slate-800');
                }
                if (qsWifiIcon) qsWifiIcon.className = 'ph-bold ph-wifi-slash text-lg text-red-500';
                if (qsWifiLabel) qsWifiLabel.textContent = '未接続 (オフライン)';
                if (notifyUser) showNotification('ネットワーク状態', 'Wi-Fi / インターネットに接続されていません。');
            }
        }

        async function refreshPairedBluetoothDevices() {
            if (navigator.bluetooth && navigator.bluetooth.getDevices) {
                try {
                    const devices = await navigator.bluetooth.getDevices();
                    devices.forEach(dev => {
                        const devName = dev.name || `Bluetooth デバイス (${dev.id.slice(0, 6)})`;
                        if (!connectedBtDevices.includes(devName)) {
                            connectedBtDevices.push(devName);
                        }
                    });
                } catch {}
            }
        }

        function updateConnectedDevicesUI() {
            const pads = navigator.getGamepads ? Array.from(navigator.getGamepads()).filter(Boolean) : [];
            detectedControllers = pads.map(p => {
                const cleanName = (p.id || 'ゲームコントローラー').replace(/\s*\([^)]*Vendor:[^)]*\)/i, '').trim();
                return cleanName || 'ゲームコントローラー';
            });

            const allDevices = [];
            if (detectedMouseName) {
                allDevices.push({ icon: 'ph-fill ph-mouse', name: detectedMouseName, type: 'マウス' });
            }
            detectedControllers.forEach(cName => {
                allDevices.push({ icon: 'ph-fill ph-game-controller', name: cName, type: 'コントローラー' });
            });
            connectedBtDevices.forEach(btName => {
                if (!allDevices.some(d => d.name === btName)) {
                    allDevices.push({ icon: 'ph-bold ph-bluetooth-connected', name: btName, type: 'Bluetooth' });
                }
            });

            const btBtn = document.getElementById('qs-bt-btn');
            const btIcon = document.getElementById('qs-bt-icon');
            const btLabel = document.getElementById('qs-bt-label');
            const trayBt = document.getElementById('tray-bt-icon');
            const listEl = document.getElementById('qs-device-items');

            if (allDevices.length > 0) {
                const primaryName = allDevices[0].name;
                if (btBtn) {
                    btBtn.classList.add('bg-blue-600', 'text-white');
                    btBtn.classList.remove('bg-white/70', 'text-slate-800');
                }
                if (btIcon) btIcon.className = 'ph-bold ph-bluetooth-connected text-lg';
                if (btLabel) btLabel.textContent = primaryName;
                if (trayBt) {
                    trayBt.classList.remove('hidden');
                    trayBt.title = `接続済み: ${allDevices.map(d => d.name).join(', ')}`;
                }
                if (listEl) {
                    listEl.innerHTML = allDevices.map(d => `
                        <div class="flex items-center gap-1.5 text-slate-800 font-medium truncate">
                            <i class="${d.icon} text-blue-600 shrink-0"></i>
                            <span class="truncate" title="${d.name}">${d.name}</span>
                        </div>
                    `).join('');
                }
            } else {
                if (btBtn) {
                    btBtn.classList.remove('bg-blue-600', 'text-white');
                    btBtn.classList.add('bg-white/70', 'text-slate-800');
                }
                if (btIcon) btIcon.className = 'ph-bold ph-bluetooth text-lg';
                if (btLabel) btLabel.textContent = '未接続';
                if (trayBt) trayBt.classList.add('hidden');
                if (listEl) {
                    listEl.innerHTML = `<div class="text-slate-400">接続されているBluetooth・機器はありません</div>`;
                }
            }
        }

        async function scanBluetoothOrDevices() {
            await refreshPairedBluetoothDevices();
            updateConnectedDevicesUI();
            if (navigator.bluetooth && navigator.bluetooth.requestDevice) {
                try {
                    const device = await navigator.bluetooth.requestDevice({ acceptAllDevices: true });
                    if (device) {
                        const devName = device.name || `Bluetooth デバイス (${device.id.slice(0, 6)})`;
                        if (!connectedBtDevices.includes(devName)) {
                            connectedBtDevices.push(devName);
                        }
                        updateConnectedDevicesUI();
                        showNotification('Bluetooth 接続', `「${devName}」を検出・接続しました。`);
                    }
                } catch (err) {
                    if (err && err.name !== 'NotFoundError') {
                        showNotification('デバイス確認', 'コントローラーのボタンを押すかマウスを動かすと自動検出されます。');
                    }
                }
            } else {
                showNotification('デバイス検出', '接続中のマウス・コントローラーの状態を更新しました。');
            }
        }

        window.addEventListener('pointermove', function detectMouseOnce(e) {
            if (e.pointerType === 'mouse' && !detectedMouseName) {
                const isMac = /Mac/i.test(navigator.platform);
                detectedMouseName = isMac ? 'Bluetooth / USB マウス' : 'HID 準拠マウス';
                updateConnectedDevicesUI();
            }
        }, { passive: true });

        window.addEventListener('gamepadconnected', (e) => {
            updateConnectedDevicesUI();
            const cleanName = (e.gamepad.id || 'コントローラー').replace(/\s*\([^)]*Vendor:[^)]*\)/i, '').trim();
            showNotification('コントローラー接続', `「${cleanName}」が接続されました。`);
        });
        window.addEventListener('gamepaddisconnected', () => {
            updateConnectedDevicesUI();
            showNotification('コントローラー切断', 'コントローラーが切断されました。');
        });

        window.addEventListener('online', () => checkRealNetworkStatus(true));
        window.addEventListener('offline', () => checkRealNetworkStatus(true));
        setInterval(async () => {
            checkRealNetworkStatus(false);
            await refreshPairedBluetoothDevices();
            updateConnectedDevicesUI();
        }, 3000);
        checkRealNetworkStatus(false);
        refreshPairedBluetoothDevices().then(updateConnectedDevicesUI);

        // --- Flyouts & Menus ---
        function toggleStartMenu(forceState) {
            const menu = document.getElementById('start-menu');
            const qs = document.getElementById('quick-settings');
            const cal = document.getElementById('calendar-flyout');
            qs.classList.add('flyout-hidden');
            if (cal) cal.classList.add('flyout-hidden');
            hideContextMenu();

            if (typeof forceState === 'boolean') {
                menu.classList.toggle('flyout-hidden', !forceState);
            } else {
                menu.classList.toggle('flyout-hidden');
            }
        }

        function toggleQuickSettings(forceState) {
            const qs = document.getElementById('quick-settings');
            const menu = document.getElementById('start-menu');
            const cal = document.getElementById('calendar-flyout');
            menu.classList.add('flyout-hidden');
            if (cal) cal.classList.add('flyout-hidden');
            hideContextMenu();

            checkRealNetworkStatus(false);
            updateConnectedDevicesUI();

            if (typeof forceState === 'boolean') {
                qs.classList.toggle('flyout-hidden', !forceState);
            } else {
                qs.classList.toggle('flyout-hidden');
            }

        function filterStartApps(query) {
            const q = query.toLowerCase().trim();
            document.querySelectorAll('.start-app-item').forEach(btn => {
                const name = btn.getAttribute('data-name').toLowerCase();
                btn.style.display = name.includes(q) ? 'flex' : 'none';

        // --- Context Menu (Suppress browser native context menu everywhere) ---
        document.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        });

        function showContextMenu(e) {
            if (e.target.closest('.desktop-icon') || e.target.closest('.win-window') || e.target.closest('footer') || e.target.closest('#start-menu') || e.target.closest('#quick-settings') || e.target.closest('#os-modal-backdrop')) return;
            e.preventDefault();
            hideContextMenu();
            const menu = document.getElementById('context-menu');
            menu.classList.remove('hidden');
            const x = Math.min(e.clientX, window.innerWidth - 250);
            const y = Math.min(e.clientY, window.innerHeight - 230);
            menu.style.left = `${x}px`;
            menu.style.top = `${y}px`;
        }

        function showTaskbarContextMenu(e) {
            if (e.target.closest('.taskbar-app-btn')) return;
            e.preventDefault();
            e.stopPropagation();
            hideContextMenu();
            const menu = document.getElementById('taskbar-context-menu');
            if (!menu) return;
            menu.classList.remove('hidden');
            const x = Math.min(e.clientX, window.innerWidth - 250);
            const y = Math.max(10, e.clientY - 135);
            menu.style.left = `${x}px`;
            menu.style.top = `${y}px`;
        }

        function showTaskbarAppContextMenu(e, appId, label) {
            e.preventDefault();
            e.stopPropagation();
            hideContextMenu();
            const menu = document.getElementById('tb-app-context-menu');
            if (!menu) return;

            document.getElementById('tb-ctx-title').textContent = label;
            const isPinned = pinnedTaskbarApps.includes(appId);
            const pinLabel = document.getElementById('tb-ctx-pin-label');
            if (pinLabel) {
                pinLabel.textContent = isPinned ? 'タスクバーからピン留めを外す' : 'タスクバーにピン留めする';
            }
            const toggleBtn = document.getElementById('tb-ctx-toggle-pin');
            toggleBtn.onclick = () => {
                hideContextMenu();
                togglePinTaskbarApp(appId);
            };

            const closeBtn = document.getElementById('tb-ctx-close');
            if (openWindows[appId]) {
                closeBtn.classList.remove('hidden');
                closeBtn.onclick = () => {
                    hideContextMenu();
                    closeWindow(appId);
                };
            } else {
                closeBtn.classList.add('hidden');
            }

            menu.classList.remove('hidden');
            const x = Math.min(e.clientX, window.innerWidth - 250);
            const y = Math.max(10, e.clientY - 115);
            menu.style.left = `${x}px`;
            menu.style.top = `${y}px`;
        }

        function showItemContextMenu(e, elementId, label, canDelete = true, storeAppId = null, isFolder = false) {
            e.preventDefault();
            e.stopPropagation();
            hideContextMenu();

            const menu = document.getElementById('item-context-menu');
            document.getElementById('item-ctx-title').textContent = label;

            const openBtn = document.getElementById('item-ctx-open');
            const pinBtn = document.getElementById('item-ctx-pin');
            const renameBtn = document.getElementById('item-ctx-rename');
            const delBtn = document.getElementById('item-ctx-delete');

            openBtn.onclick = () => {
                hideContextMenu();
                const el = document.getElementById(elementId);
                if (el) el.click();
            };

            if (pinBtn) {
                if (storeAppId && appsConfig[storeAppId]) {
                    const isPinned = pinnedTaskbarApps.includes(storeAppId);
                    pinBtn.classList.remove('hidden');
                    pinBtn.innerHTML = `<i class="ph ph-push-pin text-base text-sky-600"></i> ${isPinned ? 'タスクバーからピン留めを外す' : 'タスクバーにピン留めする'}`;
                    pinBtn.onclick = () => {
                        hideContextMenu();
                        togglePinTaskbarApp(storeAppId);
                    };
                } else {
                    pinBtn.classList.add('hidden');
                }
            }

            if (isFolder) {
                renameBtn.classList.remove('hidden');
                renameBtn.onclick = () => {
                    hideContextMenu();
                    promptRenameFolder(elementId, label);
                };
            } else {
                renameBtn.classList.add('hidden');
            }

            if (canDelete) {
                delBtn.classList.remove('opacity-40', 'pointer-events-none');
                delBtn.onclick = () => {
                    hideContextMenu();
                    deleteDesktopItem(elementId, label, storeAppId);
                };
            } else {
                delBtn.classList.add('opacity-40', 'pointer-events-none');
            }

            menu.classList.remove('hidden');
            const x = Math.min(e.clientX, window.innerWidth - 240);
            const y = Math.min(e.clientY, window.innerHeight - 190);
            menu.style.left = `${x}px`;
            menu.style.top = `${y}px`;
        }

        function hideContextMenu() {
            const ctx = document.getElementById('context-menu');
            const itemCtx = document.getElementById('item-context-menu');
            const tbCtx = document.getElementById('taskbar-context-menu');
            const tbAppCtx = document.getElementById('tb-app-context-menu');
            if (ctx) ctx.classList.add('hidden');
            if (itemCtx) itemCtx.classList.add('hidden');
            if (tbCtx) tbCtx.classList.add('hidden');
            if (tbAppCtx) tbAppCtx.classList.add('hidden');
        }

        document.addEventListener('click', (e) => {
            if (!e.target.closest('#start-menu') && !e.target.closest('#start-btn') && !e.target.closest('#taskbar-center')) {
                document.getElementById('start-menu').classList.add('flyout-hidden');
            }
            if (!e.target.closest('#quick-settings') && !e.target.closest('#tray-status-btn')) {
                document.getElementById('quick-settings').classList.add('flyout-hidden');
            }
            if (!e.target.closest('#calendar-flyout') && !e.target.closest('#taskbar-clock-btn')) {
                const cal = document.getElementById('calendar-flyout');
                if (cal) cal.classList.add('flyout-hidden');
            }
            if (!e.target.closest('#context-menu') && !e.target.closest('#item-context-menu') && !e.target.closest('#taskbar-context-menu') && !e.target.closest('#tb-app-context-menu')) {
                hideContextMenu();
            }
        });

        // --- Taskbar Pinning & Unified Rendering ---
        function togglePinTaskbarApp(appId) {
            const idx = pinnedTaskbarApps.indexOf(appId);
            if (idx >= 0) {
                pinnedTaskbarApps.splice(idx, 1);
                showNotification('タスクバー', 'ピン留めを解除しました。');
            } else {
                pinnedTaskbarApps.push(appId);
                showNotification('タスクバー', 'アプリをタスクバーにピン留めしました。');
            }
            saveSystemState();
            renderTaskbarApps();
        }

        function renderTaskbarApps() {
            const bar = document.getElementById('taskbar-apps');
            if (!bar) return;

            const openIds = Object.keys(openWindows);
            const allIds = [...new Set([...pinnedTaskbarApps, ...openIds])];

            bar.innerHTML = allIds.map(appId => {
                const config = appsConfig[appId];
                if (!config) return '';

                const isOpen = !!openWindows[appId];
                const isMinimized = isOpen && openWindows[appId].classList.contains('minimized');
                const isActive = isOpen && !isMinimized && activeAppId === appId;

                const tbFallback = appId === 'minecraft' ? MC_ICON_FALLBACK : (appId === 'browser' ? 'https://placehold.co/24x24/2563eb/ffffff?text=C' : MC_GRASS_FALLBACK);
                const iconVisual = config.iconImg
                    ? `<div class="w-6 h-6 rounded overflow-hidden flex items-center justify-center"><img src="${config.iconImg}" onerror="this.onerror=null;this.src='${tbFallback}';" class="w-full h-full object-cover ${appId === 'browser' ? 'scale-[1.45]' : ''}" alt="${config.title}"></div>`
                    : `<i class="${config.icon} text-xl"></i>`;

                const indicatorClass = isActive
                    ? 'tb-indicator tb-indicator-active'
                    : (isOpen ? 'tb-indicator tb-indicator-open' : 'tb-indicator tb-indicator-hidden');

                return `
                    <button id="tb-${appId}"
                        title="${config.title}"
                        onclick="handleTaskbarAppClick('${appId}')"
                        oncontextmenu="showTaskbarAppContextMenu(event, '${appId}', '${config.title.replace(/'/g, "\\'")}')"
                        class="taskbar-app-btn w-10 h-10 rounded-md hover:bg-white/70 active:scale-95 flex items-center justify-center transition relative ${isActive ? 'bg-white/80 shadow-xs' : ''}">
                        ${iconVisual}
                        <span class="${indicatorClass}"></span>
                    </button>
                `;
            }).join('');
        }

        function handleTaskbarAppClick(appId) {
            const win = openWindows[appId];
            if (!win) {
                openApp(appId);
                return;
            }
            if (win.classList.contains('minimized')) {
                win.classList.remove('minimized');
                focusWindow(appId);
            } else if (activeAppId === appId) {
                minimizeWindow(appId);
            } else {
                focusWindow(appId);
            }
        }

        // --- Custom Modal & Desktop Folder / App Management ---
        let folderCounter = 1;
        let desktopFolders = [];

        function openOsModal({ title, desc, defaultValue, onConfirm }) {
            const backdrop = document.getElementById('os-modal-backdrop');
            const titleEl = document.getElementById('os-modal-title');
            const descEl = document.getElementById('os-modal-desc');
            const inputEl = document.getElementById('os-modal-input');
            const confirmBtn = document.getElementById('os-modal-confirm');

            titleEl.textContent = title;
            descEl.textContent = desc;
            inputEl.value = defaultValue || '';
            backdrop.classList.remove('hidden');
            setTimeout(() => { inputEl.focus(); inputEl.select(); }, 30);

            const submit = () => {
                const val = inputEl.value.trim();
                closeOsModal();
                if (val && onConfirm) onConfirm(val);
            };
            confirmBtn.onclick = submit;
            inputEl.onkeydown = (ev) => {
                if (ev.key === 'Enter') submit();
                if (ev.key === 'Escape') closeOsModal();
            };
        }

        function closeOsModal() {
            document.getElementById('os-modal-backdrop').classList.add('hidden');
        }

        function promptCreateFolder() {
            hideContextMenu();
            openOsModal({
                title: '新規フォルダーの追加',
                desc: 'デスクトップに作成するフォルダー名を入力してください。',
                defaultValue: `新しいフォルダー (${folderCounter})`,
                onConfirm: (name) => createDesktopFolder(name)
            });
        }

        function createDesktopFolder(folderName) {
            const folderId = 'desk-folder-' + (folderCounter++);
            const folderObj = { id: folderId, name: folderName, notes: '' };
            renderSavedDesktopFolder(folderObj);
            saveSystemState();
            showNotification('フォルダー作成', `「${folderName}」を作成しました。`);
        }

        function renderSavedDesktopFolder(folderObj) {
            const desk = document.getElementById('desktop-icons');
            if (!desk) return;
            if (!desktopFolders.some(f => f.id === folderObj.id)) {
                desktopFolders.push(folderObj);
            }
            if (document.getElementById(folderObj.id)) return;

            const btn = document.createElement('button');
            btn.id = folderObj.id;
            btn.className = 'desktop-icon w-20 h-22 p-2 rounded flex flex-col items-center justify-center text-white text-center border border-transparent transition cursor-pointer';
            btn.onclick = () => openFolderWindow(folderObj.id);
            btn.oncontextmenu = (ev) => showItemContextMenu(ev, folderObj.id, folderObj.name, true, null, true);
            btn.innerHTML = `
                <div class="w-11 h-11 mb-1 flex items-center justify-center bg-gradient-to-br from-amber-300 to-amber-500 rounded-lg shadow-md">
                    <i class="ph-fill ph-folder text-2xl text-amber-950"></i>
                </div>
                <span class="folder-label text-xs drop-shadow-[0_1px_2px_rgba(0,0,0,0.9)] leading-tight line-clamp-2">${folderObj.name}</span>
            `;
            desk.appendChild(btn);
        }

        function promptRenameFolder(folderId, currentName) {
            openOsModal({
                title: 'フォルダー名の変更',
                desc: '新しいフォルダー名を入力してください。',
                defaultValue: currentName,
                onConfirm: (newName) => {
                    const folderObj = desktopFolders.find(f => f.id === folderId);
                    if (folderObj) folderObj.name = newName;
                    const el = document.getElementById(folderId);
                    if (el) {
                        const span = el.querySelector('.folder-label');
                        if (span) span.textContent = newName;
                        el.oncontextmenu = (ev) => showItemContextMenu(ev, folderId, newName, true, null, true);
                    }
                    if (openWindows[folderId]) {
                        const titleSpan = openWindows[folderId].querySelector('.win-titlebar span');
                        if (titleSpan) titleSpan.textContent = newName;
                    }
                    saveSystemState();
                    showNotification('名前を変更', `「${newName}」に変更しました。`);
                }
            });
        }

        function openFolderWindow(folderId) {
            const folderObj = desktopFolders.find(f => f.id === folderId);
            if (!folderObj) return;
            appsConfig[folderId] = {
                title: folderObj.name,
                icon: 'ph-fill ph-folder text-amber-500',
                width: 480,

                hiddenDesktopIcons.push(elementId);

                if (app) {
                    app.installed = false;
                    const storeEl = document.getElementById('store-content');
                    if (storeEl) storeEl.innerHTML = renderStoreItemsHTML();

                closeWindow(storeAppId);

            const toast = document.getElementById('toast-notification');
            document.getElementById('toast-title').textContent = title;
            document.getElementById('toast-msg').textContent = msg;
            toast.classList.remove('translate-x-[120%]');

        // --- Wallpapers & Night Light ---
        function setWallpaper(cls, customUrl = null, skipSave = false) {
            const bg = document.getElementById('desktop-bg');
            const lock = document.getElementById('lock-screen');
            const bloomSvg = document.getElementById('bloom-svg');
            if (!bg) return;

            wallpapers.forEach(w => {
                bg.classList.remove(w);
                if (lock) lock.classList.remove(w);
            });
            bg.classList.remove('wallpaper-custom');
            if (lock) lock.classList.remove('wallpaper-custom');

            if (customUrl) {
                bg.classList.add('wallpaper-custom');
                bg.style.backgroundImage = `url('${customUrl}')`;
                if (lock) {
                    lock.classList.add('wallpaper-custom');
                    lock.style.backgroundImage = `url('${customUrl}')`;
                }
                if (bloomSvg) bloomSvg.classList.add('hidden');
                savedWallpaper = { cls: null, customUrl };
            } else {
                const targetCls = cls || 'wallpaper-bloom';
                bg.style.backgroundImage = '';
                bg.classList.add(targetCls);
                currentWallpaperIdx = Math.max(0, wallpapers.indexOf(targetCls));
                if (lock) {
                    lock.style.backgroundImage = '';
                    lock.classList.add(targetCls);
                }
                if (bloomSvg) bloomSvg.classList.add('hidden');
                savedWallpaper = { cls: targetCls, customUrl: null };
            }
            if (!skipSave) saveSystemState();
        }

                return;

            customWallpapers.push({ name: `カスタム壁紙 ${customWallpapers.length + 1}`, url });

            input.value = '';
            refreshSettingsWallpaperGrid();
            saveSystemState();
            showNotification('壁紙を追加しました', '新しいカスタム壁紙を適用しました。');
        }

        function handleCustomWallpaperFile(event) {
            const file = event.target.files && event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                const dataUrl = e.target.result;
                customWallpapers.push({ name: file.name.slice(0, 18), url: dataUrl });
                setWallpaper(null, dataUrl);
                refreshSettingsWallpaperGrid();
                saveSystemState();
                showNotification('壁紙を追加しました', `「${file.name}」を壁紙に設定しました。`);

            reader.readAsDataURL(file);

                'video/webm;codecs=vp8',
