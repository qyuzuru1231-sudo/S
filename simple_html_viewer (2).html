<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>シンプル HTML ビューワー</title>
    <!-- Tailwind CSSの読み込み -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts (Inter & Noto Sans JP) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 h-screen w-screen overflow-hidden">

    <!-- 非表示のファイル入力 -->
    <input type="file" id="fileInput" accept=".html,.htm" class="hidden">

    <!-- メインコンテンツエリア（全画面） -->
    <main id="dropZone" class="w-full h-full flex items-center justify-center p-4">
        
        <!-- 初期状態のドロップエリア -->
        <div id="emptyState" class="w-full max-w-md border-2 border-dashed border-slate-300 rounded-2xl p-8 text-center bg-white transition-all hover:border-blue-400">
            <h2 class="text-lg font-bold text-slate-800 mb-2">HTMLファイルをドロップ</h2>
            <p class="text-sm text-slate-500 mb-6">またはボタンからファイルを選択</p>
            <label for="fileInput" class="inline-block cursor-pointer bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium px-6 py-2.5 rounded-xl transition-colors">
                HTMLを開く
            </label>
        </div>

        <!-- HTMLプレビュー用iframe（読み込み後は全画面表示・ポインターロック許可） -->
        <iframe id="htmlFrame" class="hidden w-full h-full border-0 bg-white" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-pointer-lock allow-downloads" allow="pointer-events; fullscreen"></iframe>

        <!-- カスタムメッセージボックス（エラー通知用） -->
        <div id="toastMessage" class="fixed bottom-4 right-4 bg-red-600 text-white px-4 py-3 rounded-xl shadow-lg text-sm font-medium transform translate-y-20 opacity-0 transition-all duration-300 flex items-center gap-2 z-50">
            <span id="toastText">エラーが発生しました</span>
        </div>

    </main>

    <script>
        // DOM要素の取得
        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('dropZone');
        const emptyState = document.getElementById('emptyState');
        const htmlFrame = document.getElementById('htmlFrame');
        const toastMessage = document.getElementById('toastMessage');
        const toastText = document.getElementById('toastText');

        // 現在読み込まれているBlob URLを保持する変数
        let currentBlobUrl = null;

        /**
         * トースト通知を表示する関数（alertの代替）
         * @param {string} message 表示するメッセージ
         */
        function showToast(message) {
            toastText.textContent = message;
            toastMessage.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toastMessage.classList.add('translate-y-20', 'opacity-0');
            }, 3500);
        }

        /**
         * 選択されたHTMLファイルを読み込み、全画面に表示する関数
         * @param {File} file 読み込むFileオブジェクト
         */
        function loadHtmlFile(file) {
            try {
                if (!file) return;

                // 拡張子またはMIMEタイプの簡易チェック
                const isHtml = file.type === 'text/html' || file.name.toLowerCase().endsWith('.html') || file.name.toLowerCase().endsWith('.htm');
                if (!isHtml) {
                    showToast('HTMLファイル（.html または .htm）を選択してください。');
                    return;
                }

                // 以前のBlob URLが存在する場合はメモリ解放
                if (currentBlobUrl) {
                    URL.revokeObjectURL(currentBlobUrl);
                }

                // ファイルからBlob URLを生成
                currentBlobUrl = URL.createObjectURL(file);

                // 事前にHTMLの中身を直接解析して、HTML内で決められたタイトルとアイコンを取得・反映する
                const reader = new FileReader();
                reader.onload = (e) => {
                    const parser = new DOMParser();
                    const parsedDoc = parser.parseFromString(e.target.result, 'text/html');
                    
                    // HTML内で決められた<title>があれば反映
                    if (parsedDoc.title) {
                        document.title = parsedDoc.title;
                    }
                    
                    // HTML内で決められたファビコンがあれば反映
                    const parsedIcon = parsedDoc.querySelector('link[rel*="icon"]');
                    if (parsedIcon) {
                        const iconHref = parsedIcon.getAttribute('href');
                        if (iconHref) {
                            let parentIcon = document.querySelector('link[rel="icon"]');
                            if (!parentIcon) {
                                parentIcon = document.createElement('link');
                                parentIcon.rel = 'icon';
                                document.head.appendChild(parentIcon);
                            }
                            parentIcon.href = iconHref;
                        }
                    }
                };
                reader.readAsText(file);

                // iframeにURLを設定し、余白をなくして全画面表示に切り替え
                htmlFrame.src = currentBlobUrl;
                emptyState.classList.add('hidden');
                dropZone.classList.remove('p-4');
                htmlFrame.classList.remove('hidden');

                // 読み込み完了後や、JSによって動的にタイトル・アイコンが変更された場合も追従させる
                htmlFrame.onload = () => {
                    const syncMetadata = () => {
                        try {
                            const doc = htmlFrame.contentDocument || htmlFrame.contentWindow.document;
                            if (doc) {
                                // HTML内で決められたタイトルを反映（ファイル名へのフォールバックなし）
                                if (doc.title && document.title !== doc.title) {
                                    document.title = doc.title;
                                }

                                // HTML内で決められたアイコン（ファビコン）を反映
                                const iconLink = doc.querySelector('link[rel*="icon"]');
                                if (iconLink) {
                                    const href = iconLink.getAttribute('href') || iconLink.href;
                                    if (href) {
                                        let parentIcon = document.querySelector('link[rel="icon"]');
                                        if (!parentIcon) {
                                            parentIcon = document.createElement('link');
                                            parentIcon.rel = 'icon';
                                            document.head.appendChild(parentIcon);
                                        }
                                        if (parentIcon.href !== href) {
                                            parentIcon.href = href;
                                        }
                                    }
                                }
                            }
                        } catch (e) {
                            // クロスオリジン制限などでアクセスできない場合は無視
                        }
                    };

                    // 初回同期
                    syncMetadata();

                    // Eaglercraft等のように後からJSでタイトルやアイコンを変更するHTML向けに監視を設定
                    try {
                        const doc = htmlFrame.contentDocument || htmlFrame.contentWindow.document;
                        if (doc && doc.head) {
                            const observer = new MutationObserver(() => syncMetadata());
                            observer.observe(doc.head, { childList: true, subtree: true, attributes: true, characterData: true });
                        }
                    } catch (e) {}
                };

            } catch (error) {
                console.error('ファイル読み込みエラー:', error);
                showToast('ファイルの読み込み中にエラーが発生しました。');
            }
        }

        // ファイル選択インプットの変更イベント
        fileInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            loadHtmlFile(file);
        });

        // ドラッグ＆ドロップのイベント設定
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => {
                e.preventDefault();
                e.stopPropagation();
            }, false);
        });

        // ドラッグ中の視覚フィードバック
        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => {
                emptyState.classList.add('border-blue-500', 'bg-blue-50');
            }, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => {
                emptyState.classList.remove('border-blue-500', 'bg-blue-50');
            }, false);
        });

        // ファイルドロップ時の処理
        dropZone.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            const file = dt.files[0];
            loadHtmlFile(file);
        }, false);
    </script>
</body>
</html>
