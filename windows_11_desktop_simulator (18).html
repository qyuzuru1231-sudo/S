            const titleH = Math.max(28, 36 * scaleY);

            // Window Frame
            ctx.fillStyle = appId === 'terminal' ? '#0c0c0c' : (appId === 'minecraft' || appId === 'recorder' || appId.startsWith('web_') || appId.startsWith('store_') ? '#18181b' : '#ffffff');
            ctx.fillRect(wx, wy, ww, wh);
            ctx.strokeStyle = activeAppId === appId ? '#0078d4' : '#64748b';
            ctx.lineWidth = 2;
            ctx.strokeRect(wx, wy, ww, wh);

            // Title Bar
            ctx.fillStyle = (appId === 'minecraft' || appId === 'recorder' || appId.startsWith('web_') || appId.startsWith('store_')) ? '#18181b' : '#f1f5f9';
            ctx.fillRect(wx, wy, ww, titleH);
            ctx.fillStyle = (appId === 'minecraft' || appId === 'recorder' || appId.startsWith('web_') || appId.startsWith('store_')) ? '#f8fafc' : '#0f172a';
            ctx.font = `bold ${Math.max(13, Math.round(14 * scaleY))}px sans-serif`;
            ctx.fillText(cfg.title, wx + 12 * scaleX, wy + titleH * 0.65);

            // Live App Content Preview inside Window
            ctx.save();
            ctx.beginPath();
            ctx.rect(wx + 2, wy + titleH, ww - 4, Math.max(1, wh - titleH - 2));
            ctx.clip();

            if (appId === 'notepad') {
                const text = document.getElementById('notepad-area')?.value || savedNotepadText || '';
                ctx.fillStyle = '#1e293b';
                ctx.font = `${Math.max(13, Math.round(14 * scaleY))}px sans-serif`;
                text.split('\n').slice(0, 24).forEach((line, idx) => {
                    ctx.fillText(line, wx + 16 * scaleX, wy + titleH + (26 + idx * 22) * scaleY);
                });
            } else if (appId === 'calculator') {
                const disp = document.getElementById('calc-display')?.textContent || '0';
                ctx.fillStyle = '#f8fafc';
                ctx.fillRect(wx + 12 * scaleX, wy + titleH + 12 * scaleY, ww - 24 * scaleX, 60 * scaleY);
                ctx.fillStyle = '#0f172a';
                ctx.font = `bold ${Math.max(22, Math.round(28 * scaleY))}px sans-serif`;
                ctx.textAlign = 'right';
                ctx.fillText(disp, wx + ww - 24 * scaleX, wy + titleH + 52 * scaleY);
                ctx.textAlign = 'left';
            } else if (appId === 'terminal') {
                const out = document.getElementById('term-output')?.innerText || '';
                ctx.fillStyle = '#34d399';
                ctx.font = `${Math.max(12, Math.round(13 * scaleY))}px monospace`;
                out.split('\n').slice(-20).forEach((line, idx) => {
                    ctx.fillText(line, wx + 14 * scaleX, wy + titleH + (22 + idx * 20) * scaleY);
                });
            } else if (appId === 'browser') {
                const urlVal = document.getElementById('edge-url')?.value || CHROME_HOME_URL;
                ctx.fillStyle = '#e2e8f0';
                ctx.fillRect(wx, wy + titleH, ww, 34 * scaleY);
                ctx.fillStyle = '#334155';
                ctx.font = `${Math.max(12, Math.round(13 * scaleY))}px sans-serif`;
                ctx.fillText(`URL: ${urlVal}`, wx + 14 * scaleX, wy + titleH + 22 * scaleY);
                ctx.fillStyle = '#475569';
                ctx.fillText(`アクティブタブ: ${edgeTabs.find(t => t.id === activeEdgeTabId)?.title || '新しいタブ'}`, wx + 18 * scaleX, wy + titleH + 64 * scaleY);
            } else if (appId === 'minecraft' || appId.startsWith('web_') || appId.startsWith('store_')) {
                const grad = ctx.createLinearGradient(wx, wy + titleH, wx + ww, wy + wh);
                grad.addColorStop(0, '#064e3b');
                grad.addColorStop(0.5, '#0f172a');
                grad.addColorStop(1, '#1e293b');
                ctx.fillStyle = grad;
                ctx.fillRect(wx, wy + titleH, ww, wh - titleH);

                ctx.fillStyle = '#34d399';
                ctx.font = `bold ${Math.max(16, Math.round(20 * scaleY))}px sans-serif`;
                ctx.fillText(`● ${cfg.title} — キャプチャ中`, wx + 24 * scaleX, wy + titleH + 46 * scaleY);

                const winEl = openWindows[appId];
                const innerLines = (winEl?.innerText || '').split('\n').map(s => s.trim()).filter(Boolean).slice(1, 14);
                ctx.fillStyle = '#e2e8f0';
                ctx.font = `${Math.max(12, Math.round(14 * scaleY))}px sans-serif`;
                innerLines.forEach((line, idx) => {
                    ctx.fillText(line.slice(0, 75), wx + 24 * scaleX, wy + titleH + (82 + idx * 24) * scaleY);
                });
            } else {
                const winEl = openWindows[appId];
                const innerLines = (winEl?.innerText || '').split('\n').map(s => s.trim()).filter(Boolean).slice(1, 18);
                ctx.fillStyle = (appId === 'recorder') ? '#e2e8f0' : '#334155';
                ctx.font = `${Math.max(12, Math.round(13 * scaleY))}px sans-serif`;
                innerLines.forEach((line, idx) => {
                    ctx.fillText(line.slice(0, 75), wx + 16 * scaleX, wy + titleH + (24 + idx * 22) * scaleY);
                });
            }
            ctx.restore();
        }

        // High-detail internal compositor that renders either a single selected app window or the entire simulator desktop
        function renderSimulatorFrameToShadowCanvas(eventBannerText = '') {
            ensureShadowCaptureCanvas();
            const w = scCanvas.width;
            const h = scCanvas.height;
            const ctx = scCtx;

            const targetId = scConfig.targetAppId || 'desktop';
            if (targetId !== 'desktop') {
                const targetWin = openWindows[targetId];
                ctx.fillStyle = '#090d16';
                ctx.fillRect(0, 0, w, h);

                if (targetWin && appsConfig[targetId]) {
                    const rect = targetWin.getBoundingClientRect();
                    const srcW = Math.max(1, rect.width);
                    const srcH = Math.max(1, rect.height);
                    const fitScale = Math.min(w / srcW, h / srcH);
                    const drawW = srcW * fitScale;
                    const drawH = srcH * fitScale;
                    const offsetX = (w - drawW) / 2;
                    const offsetY = (h - drawH) / 2;

                    drawSingleWindowToContext(ctx, targetId, offsetX, offsetY, drawW, drawH, fitScale, fitScale);

                    // Relative cursor inside the target window
                    if (!targetWin.classList.contains('minimized')) {
                        const relX = (scLastPointer.x - rect.left) * fitScale + offsetX;
                        const relY = (scLastPointer.y - rect.top) * fitScale + offsetY;
                        if (relX >= offsetX && relX <= offsetX + drawW && relY >= offsetY && relY <= offsetY + drawH) {
                            ctx.fillStyle = '#ffffff';
                            ctx.strokeStyle = '#0f172a';
                            ctx.lineWidth = 2;
                            ctx.beginPath();
                            ctx.moveTo(relX, relY);
                            ctx.lineTo(relX, relY + 18 * fitScale);
                            ctx.lineTo(relX + 5 * fitScale, relY + 14 * fitScale);
                            ctx.lineTo(relX + 12 * fitScale, relY + 14 * fitScale);
                            ctx.closePath();
                            ctx.fill();
                            ctx.stroke();
                        }
                    }
                } else {
                    ctx.fillStyle = '#94a3b8';
                    ctx.font = 'bold 24px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText('選択されたアプリは閉じられています', w / 2, h / 2);
                    ctx.textAlign = 'left';
                }

                if (eventBannerText) {
                    ctx.fillStyle = 'rgba(16, 185, 129, 0.95)';
                    ctx.fillRect(w / 2 - 260, 24, 520, 44);
                    ctx.fillStyle = '#090d16';
                    ctx.font = 'bold 20px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(eventBannerText, w / 2, 53);
                    ctx.textAlign = 'left';
                }
                return;
            }

            // 1. Wallpaper background matching active theme
            const grad = ctx.createLinearGradient(0, 0, w, h);
            if (savedWallpaper.cls === 'wallpaper-sunset') {
                grad.addColorStop(0, '#ff7e5f');
                grad.addColorStop(0.5, '#6a11cb');
                grad.addColorStop(1, '#2575fc');
            } else if (savedWallpaper.cls === 'wallpaper-mint') {
                grad.addColorStop(0, '#10b981');
                grad.addColorStop(0.5, '#064e3b');
                grad.addColorStop(1, '#3b82f6');
            } else if (savedWallpaper.cls === 'wallpaper-dark') {
                grad.addColorStop(0, '#1e293b');
                grad.addColorStop(1, '#000000');
            } else {
                grad.addColorStop(0, '#0078d4');
                grad.addColorStop(0.5, '#0f172a');
                grad.addColorStop(1, '#020617');
            }
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, h);

            const scaleX = w / Math.max(1, window.innerWidth);
            const scaleY = h / Math.max(1, window.innerHeight);

            // 2. Desktop Icons
            document.querySelectorAll('#desktop-icons .desktop-icon').forEach(iconBtn => {
                const r = iconBtn.getBoundingClientRect();
                const ix = r.left * scaleX;
                const iy = r.top * scaleY;
                const iw = r.width * scaleX;
                const ih = r.height * scaleY;
                ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
                ctx.fillRect(ix + 8 * scaleX, iy + 6 * scaleY, iw - 16 * scaleX, ih * 0.55);
                ctx.fillStyle = '#ffffff';
                ctx.font = `${Math.max(11, Math.round(12 * scaleY))}px sans-serif`;
                ctx.textAlign = 'center';
                const label = (iconBtn.innerText || '').trim().split('\n')[0];
                ctx.fillText(label, ix + iw / 2, iy + ih - 8 * scaleY);
                ctx.textAlign = 'left';
            });

            // 3. Open Windows sorted by z-index + live inner contents
            const sortedIds = Object.keys(openWindows).sort((a, b) => {
                return (parseInt(openWindows[a].style.zIndex || '1', 10)) - (parseInt(openWindows[b].style.zIndex || '1', 10));
            });

            sortedIds.forEach(appId => {
                const winEl = openWindows[appId];
                const cfg = appsConfig[appId];
                if (!winEl || !cfg || winEl.classList.contains('minimized')) return;
                const rect = winEl.getBoundingClientRect();
                drawSingleWindowToContext(ctx, appId, rect.left * scaleX, rect.top * scaleY, rect.width * scaleX, rect.height * scaleY, scaleX, scaleY);
            });

            // 4. Start Menu if open
            const startMenu = document.getElementById('start-menu');
            if (startMenu && !startMenu.classList.contains('flyout-hidden')) {
                const sr = startMenu.getBoundingClientRect();
                ctx.fillStyle = 'rgba(243, 243, 243, 0.94)';
                ctx.fillRect(sr.left * scaleX, sr.top * scaleY, sr.width * scaleX, sr.height * scaleY);
                ctx.fillStyle = '#0f172a';
                ctx.font = `bold ${Math.round(15 * scaleY)}px sans-serif`;
                ctx.fillText('スタートメニュー', (sr.left + 20) * scaleX, (sr.top + 32) * scaleY);
            }

            // 5. Taskbar & Clock
            const tbH = 48 * scaleY;
            ctx.fillStyle = osSettingsState.darkMode ? 'rgba(32, 32, 32, 0.94)' : 'rgba(243, 243, 243, 0.92)';
            ctx.fillRect(0, h - tbH, w, tbH);
            ctx.fillStyle = osSettingsState.darkMode ? '#ffffff' : '#0f172a';
            ctx.font = `bold ${Math.max(12, Math.round(13 * scaleY))}px sans-serif`;
            ctx.textAlign = 'right';
            ctx.fillText(document.getElementById('taskbar-time')?.textContent || '', w - 24 * scaleX, h - tbH + 20 * scaleY);
            ctx.fillText(document.getElementById('taskbar-date')?.textContent || '', w - 24 * scaleX, h - tbH + 38 * scaleY);
            ctx.textAlign = 'left';

            // 6. Mouse Pointer Arrow
            const px = scLastPointer.x * scaleX;
            const py = scLastPointer.y * scaleY;
            ctx.fillStyle = '#ffffff';
            ctx.strokeStyle = '#0f172a';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(px, py);
            ctx.lineTo(px, py + 18 * scaleY);
            ctx.lineTo(px + 5 * scaleX, py + 14 * scaleY);
            ctx.lineTo(px + 12 * scaleX, py + 14 * scaleY);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            if (eventBannerText) {
                ctx.fillStyle = 'rgba(16, 185, 129, 0.95)';
                ctx.fillRect(w / 2 - 260, 24, 520, 44);
                ctx.fillStyle = '#090d16';
                ctx.font = 'bold 20px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(eventBannerText, w / 2, 53);
                ctx.textAlign = 'left';
            }
        }

        async function toggleShadowReplay() {
            if (scConfig.instantReplayEnabled) {
                scConfig.instantReplayEnabled = false;
                stopShadowReplayBuffer();
                showNotification('ShadowCapture Pro', 'インスタントリプレイを停止しました。');
                saveSystemState();
                refreshShadowCaptureUI();
                return;
            }

            const stream = createInternalSimulatorStream();
            scConfig.instantReplayEnabled = true;
            startShadowReplayBuffer(stream);
            showNotification('ShadowCapture Pro', '過去2分間のインスタントリプレイを開始しました（共有バー無し）。');
            saveSystemState();
            refreshShadowCaptureUI();
        }

        function startShadowReplayBuffer(stream) {
            stopShadowReplayBuffer();
            scRingChunks = [];

            const spec = getShadowPresetSpec();
            const mimeType = getSupportedRecorderMimeType();
            const recOptions = mimeType ? { mimeType, videoBitsPerSecond: spec.bps } : { videoBitsPerSecond: spec.bps };

            const drawLoop = () => {
                if (!scConfig.instantReplayEnabled) return;
                renderSimulatorFrameToShadowCanvas();
                requestAnimationFrame(drawLoop);
            };
            drawLoop();

            try {
                scRingRecorder = new MediaRecorder(stream, recOptions);
                scRingRecorder.ondataavailable = (ev) => {
                    if (ev.data && ev.data.size > 0) {
                        scRingChunks.push(ev.data);
                        while (scRingChunks.length > scConfig.bufferSeconds + 1) {
                            scRingChunks.splice(1, 1);
                        }
                        const badge = document.getElementById('sc-live-badge');
                        if (badge && scConfig.instantReplayEnabled && !scIsManualRecording) {
                            const secCount = Math.min(120, Math.max(1, scRingChunks.length - 1));
                            badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> 2分リプレイ稼働中 (${secCount}秒)`;
                        }
                    }
                };
                scRingRecorder.start(1000);
            } catch (e) {
                console.warn('Ring recorder start failed:', e);
            }
        }

        function stopShadowReplayBuffer() {
            if (scBufferTimer) {
                clearInterval(scBufferTimer);
                scBufferTimer = null;
            }
            if (scRingRecorder && scRingRecorder.state !== 'inactive') {
                try { scRingRecorder.stop(); } catch {}
            }
            scRingRecorder = null;
        }

        async function saveShadowInstantReplay(label = '過去2分リプレイ') {
            if (scRingChunks.length > 0) {
                const combinedBlob = new Blob(scRingChunks, { type: 'video/webm' });
                const url = URL.createObjectURL(combinedBlob);
                const durationSec = Math.min(120, Math.max(1, scRingChunks.length - 1));
                const targetName = getShadowTargetLabel();
                scSavedClips.unshift({
                    id: 'clip_' + Date.now(),
                    title: `[${targetName}] ${label} (${durationSec}秒)`,
                    time: new Date().toLocaleTimeString('ja-JP'),
                    preset: getShadowPresetSpec().label,
                    url
                });
                refreshShadowCaptureUI();
                showNotification('ShadowCapture Pro', `「${targetName}」の直前 ${durationSec} 秒間クリップを保存しました！`);
            } else {
                const stream = createInternalSimulatorStream();
                const spec = getShadowPresetSpec();
                const mimeType = getSupportedRecorderMimeType();
                const rec = new MediaRecorder(stream, mimeType ? { mimeType, videoBitsPerSecond: spec.bps } : { videoBitsPerSecond: spec.bps });
                const chunks = [];
                const targetName = getShadowTargetLabel();
                rec.ondataavailable = e => { if (e.data && e.data.size > 0) chunks.push(e.data); };
                rec.onstop = () => {
                    const blob = new Blob(chunks, { type: 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    scSavedClips.unshift({
                        id: 'clip_' + Date.now(),
                        title: `[${targetName}] ${label}`,
                        time: new Date().toLocaleTimeString('ja-JP'),
                        preset: spec.label,
                        url
                    });
                    refreshShadowCaptureUI();
                    showNotification('ShadowCapture Pro', `「${targetName}」の「${label}」を保存しました！`);
                };
                rec.start(200);
                let active = true;
                const drawTick = () => {
                    if (!active) return;
                    renderSimulatorFrameToShadowCanvas(`★ ${targetName}: ${label}`);
                    requestAnimationFrame(drawTick);
                };
                drawTick();
                setTimeout(() => {
                    active = false;
                    if (rec.state === 'recording') rec.stop();
                }, 2500);
            }
        }

        function triggerMinecraftKillHighlight() {
            if (!scConfig.autoHighlightKill) {
                showNotification('ShadowCapture Pro', 'キル時自動クリップがOFFになっています。');
                return;
            }
            saveShadowInstantReplay('Minecraft キルハイライト (過去2分)');
        }

        async function toggleShadowManualRecord() {
            if (scIsManualRecording) {
                scIsManualRecording = false;
                if (scManualAnimId) {
                    cancelAnimationFrame(scManualAnimId);
                    scManualAnimId = null;
                }
                if (scManualRecorder && scManualRecorder.state === 'recording') {
                    scManualRecorder.stop();
                }
                refreshShadowCaptureUI();
                return;
            }

            const stream = createInternalSimulatorStream();
            const spec = getShadowPresetSpec();
            const mimeType = getSupportedRecorderMimeType();
            const recOptions = mimeType ? { mimeType, videoBitsPerSecond: spec.bps } : { videoBitsPerSecond: spec.bps };

            scManualChunks = [];
            const targetName = getShadowTargetLabel();
            scManualRecorder = new MediaRecorder(stream, recOptions);
            scManualRecorder.ondataavailable = (e) => {
                if (e.data && e.data.size > 0) scManualChunks.push(e.data);
            };
            scManualRecorder.onstop = () => {
                const blob = new Blob(scManualChunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                scSavedClips.unshift({
                    id: 'clip_' + Date.now(),
                    title: `[${targetName}] 録画クリップ`,
                    time: new Date().toLocaleTimeString('ja-JP'),
                    preset: spec.label,
                    url
                });
                refreshShadowCaptureUI();
                showNotification('録画完了', `「${targetName}」の録画を保存しました！`);
            };

            scIsManualRecording = true;
            scManualRecorder.start(250);

            const drawLoop = () => {
                if (!scIsManualRecording) return;
                renderSimulatorFrameToShadowCanvas();
                scManualAnimId = requestAnimationFrame(drawLoop);
            };
            drawLoop();

            refreshShadowCaptureUI();
            showNotification('録画開始', `「${targetName}」の録画を開始しました（共有バー表示なし）。`);
        }

        function setShadowPreset(presetKey) {
            scConfig.preset = presetKey;
            saveSystemState();
            refreshShadowCaptureUI();
        }

        function refreshShadowCaptureUI() {
            // Render Open Apps + Desktop Whole Target Selector
            const targetContainer = document.getElementById('sc-target-apps-list');
            if (targetContainer) {
                if (scConfig.targetAppId !== 'desktop' && !openWindows[scConfig.targetAppId]) {
                    scConfig.targetAppId = 'desktop';
                }
                const openIds = Object.keys(openWindows).filter(id => appsConfig[id]);
                const items = [
                    {
                        id: 'desktop',
                        title: 'デスクトップ全体',
                        iconHtml: `<i class="ph-fill ph-desktop text-sky-400 text-base shrink-0"></i>`
                    },
                    ...openIds.map(id => {
                        const cfg = appsConfig[id];
                        const iconHtml = cfg.iconImg
                            ? `<img src="${cfg.iconImg}" class="w-4 h-4 rounded-xs object-cover shrink-0" alt="">`
                            : `<i class="${cfg.icon || 'ph-fill ph-app-window'} text-base shrink-0"></i>`;
                        return { id, title: cfg.title, iconHtml };
                    })
                ];

                targetContainer.innerHTML = items.map(item => {
                    const selected = scConfig.targetAppId === item.id;
                    return `
                        <button onclick="setShadowTargetApp('${item.id}')" class="px-2.5 py-2 rounded-lg border text-left flex items-center gap-2 transition min-w-0 ${selected ? 'border-sky-400 bg-sky-500/20 text-white font-bold shadow-xs' : 'border-slate-700 bg-slate-800/75 text-slate-300 hover:bg-slate-800'}">
                            ${item.iconHtml}
                            <span class="text-[11px] truncate flex-1">${item.title}</span>
                            ${selected ? '<i class="ph-fill ph-check-circle text-sky-400 text-xs shrink-0"></i>' : ''}
                        </button>
                    `;
                }).join('');
            }

            const badge = document.getElementById('sc-live-badge');
            if (badge) {
                if (scIsManualRecording) {
                    badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-red-500 animate-ping"></span> 録画中 (${getShadowTargetLabel()})`;
                    badge.className = 'px-3 py-1 rounded-full bg-red-950/80 border border-red-500/50 text-xs font-bold text-red-300 flex items-center gap-1.5';
                } else if (scConfig.instantReplayEnabled) {
                    const secCount = Math.min(120, Math.max(0, scRingChunks.length - 1));
                    badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> 2分リプレイ稼働中 (${secCount}秒)`;
                    badge.className = 'px-3 py-1 rounded-full bg-emerald-950/80 border border-emerald-500/50 text-xs font-bold text-emerald-300 flex items-center gap-1.5';
                } else {
                    badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-slate-500"></span> 待機中`;
                    badge.className = 'px-3 py-1 rounded-full bg-slate-800 border border-slate-700 text-xs font-bold text-slate-300 flex items-center gap-1.5';
                }
            }

            const replayBtn = document.getElementById('sc-replay-toggle-btn');
            if (replayBtn) {
                replayBtn.textContent = scConfig.instantReplayEnabled ? '稼働中 (停止)' : '起動する';
                replayBtn.className = scConfig.instantReplayEnabled
                    ? 'px-3.5 py-1.5 rounded-lg bg-slate-700 hover:bg-slate-600 text-emerald-300 border border-emerald-500/40 text-xs font-bold transition shrink-0'
                    : 'px-3.5 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold transition shrink-0';
            }

            const manualBtn = document.getElementById('sc-manual-rec-btn');
            if (manualBtn) {
                manualBtn.textContent = scIsManualRecording ? '録画停止' : '録画開始';
                manualBtn.className = scIsManualRecording
                    ? 'px-4 py-2 rounded-lg bg-slate-700 hover:bg-slate-600 text-red-300 border border-red-500/50 text-xs font-bold transition shrink-0'
                    : 'px-4 py-2 rounded-lg bg-red-600 hover:bg-red-500 text-white text-xs font-bold transition shrink-0';
            }

            ['ultralight', 'light1080', 'high1080'].forEach(key => {
                const btn = document.getElementById(`sc-preset-${key}`);
                if (!btn) return;
                if (scConfig.preset === key) {
                    btn.className = 'p-2 rounded-lg border border-emerald-400 bg-emerald-500/20 text-emerald-200 text-left transition';
                } else {
                    btn.className = 'p-2 rounded-lg border border-slate-700 bg-slate-800/70 text-slate-300 hover:bg-slate-800 text-left transition';
                }
            });

            const autoKillChk = document.getElementById('sc-chk-autokill');
            if (autoKillChk) autoKillChk.checked = !!scConfig.autoHighlightKill;
            const lowCpuChk = document.getElementById('sc-chk-lowcpu');
            if (lowCpuChk) lowCpuChk.checked = !!scConfig.lowCpuMode;

            const listEl = document.getElementById('sc-clips-list');
            if (listEl) {
                if (scSavedClips.length === 0) {
                    listEl.innerHTML = `<div class="text-xs text-slate-500 text-center py-8">まだ保存されたクリップはありません</div>`;
                } else {
                    listEl.innerHTML = scSavedClips.map(c => `
                        <div class="p-2.5 rounded-lg bg-slate-800/90 border border-slate-700 space-y-1.5">
                            <div class="text-xs font-bold text-emerald-300 truncate">${c.title}</div>
                            <div class="text-[10px] text-slate-400">${c.time} • ${c.preset}</div>

        // --- Store Render ---
        function renderStoreItemsHTML() {
            let html = `
                <div>
                    <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2.5">おすすめアプリ</h3>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">

            storeCatalog.forEach(app => {
                const fallbackSrc = app.id === 'minecraft' ? MC_ICON_FALLBACK : 'https://placehold.co/48x48/16a34a/ffffff?text=APP';
                const iconHtml = app.iconImg
                    ? `<img src="${app.iconImg}" onerror="this.onerror=null;this.src='${fallbackSrc}';" class="w-12 h-12 rounded-xl object-cover shrink-0 shadow" alt="${app.name}">`
                    : `<div class="w-12 h-12 rounded-xl bg-gradient-to-br ${app.color} text-white flex items-center justify-center shrink-0 shadow"><i class="${app.icon} text-2xl"></i></div>`;
                html += `

                            <div class="text-[11px] text-slate-500">${app.category}</div>
                            <p class="text-xs text-slate-600 mt-1 line-clamp-2">${app.desc}</p>

                                    : `<button onclick="installStoreApp('${app.id}')" class="px-3.5 py-1 bg-blue-600 hover:bg-blue-700 text-white rounded-md text-xs font-semibold transition">入手 / インストール</button>`
                                }
                            </div>
                        </div>
                    </div>
                `;
            });
            html += `</div></div>`;
            return html;

        function launchStoreApp(appId) {
            const app = storeCatalog.find(a => a.id === appId);
            if (!app) return;
            if (app.type === 'webgame' && app.url) {
                openWebFrame(app.name, app.url, app.iconImg, !!app.aspectLock, `store_${app.id}`);
            } else {
                openApp(app.id);
            }
        }

        function installStoreApp(appId) {
            const app = storeCatalog.find(a => a.id === appId);
            if (!app || app.installed) return;
            showNotification('Microsoft Store', `${app.name} をダウンロード中...`);
            setTimeout(() => {
                app.installed = true;
                pinBuiltinToDesktop(appId, app.name, app.icon, app.color, app.iconImg);
                const storeEl = document.getElementById('store-content');
                if (storeEl) storeEl.innerHTML = renderStoreItemsHTML();
                saveSystemState();
                showNotification('インストール完了', `${app.name} がデスクトップに追加されました！`);
            }, 900);
        }

        function pinBuiltinToDesktop(appId, label, iconClass, gradientClass, iconImg) {
            const desk = document.getElementById('desktop-icons');
            if (!desk || document.getElementById(`desk-icon-${appId}`)) return;
            const btn = document.createElement('button');
            btn.id = `desk-icon-${appId}`;
            btn.onclick = () => launchStoreApp(appId);
            btn.oncontextmenu = (ev) => showItemContextMenu(ev, `desk-icon-${appId}`, label, true, appId, false);
            btn.className = 'desktop-icon w-20 h-22 p-2 rounded flex flex-col items-center justify-center text-white text-center border border-transparent transition cursor-pointer';
            const fallbackSrc = appId === 'minecraft' ? MC_ICON_FALLBACK : 'https://placehold.co/44x44/16a34a/ffffff?text=APP';
            const iconVisual = iconImg
                ? `<div class="w-11 h-11 mb-1 rounded-lg overflow-hidden flex items-center justify-center drop-shadow-md"><img src="${iconImg}" onerror="this.onerror=null;this.src='${fallbackSrc}';" class="w-full h-full object-cover" alt="${label}"></div>`
                : `<div class="w-11 h-11 mb-1 flex items-center justify-center bg-gradient-to-br ${gradientClass} rounded-lg shadow-md"><i class="${iconClass} text-2xl text-white"></i></div>`;
            btn.innerHTML = `
                ${iconVisual}
                <span class="text-xs drop-shadow-[0_1px_2px_rgba(0,0,0,0.9)] leading-tight line-clamp-2">${label}</span>
            `;
            desk.appendChild(btn);

        // --- Minecraft Launcher Tabs & Config Management ---

        function toggleMcAddConfigForm(forceState) {

                mcPendingHtmlFileName = '';

            switchMcTopTab('configs');

        function renderMcPlayTabHTML() {

            const currentVer = allVers.find(v => v.id === mcSelectedVersionId) || allVers[0];

                return `<option value="${v.id}" ${v.id === mcSelectedVersionId ? 'selected' : ''} class="bg-[#1e1e1e] text-white">${v.name}${v.desc ? ` (${v.desc})` : ''}</option>`;
            }).join('');

            return `

                    <img src="${MC_LOGO_URL}" onerror="this.style.display='none'" class="w-[190px] sm:w-[225px] max-w-[65%] h-auto drop-shadow-[0_6px_16px_rgba(0,0,0,0.85)]" alt="MINECRAFT">

        function handleMcConfigHtmlFile(event) {
            const file = event.target.files && event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                mcPendingHtmlContent = e.target.result;
                mcPendingHtmlFileName = file.name;
                const labelEl = document.getElementById('mc-html-file-label');
                if (labelEl) labelEl.textContent = `選択済み: ${file.name}`;

            reader.readAsText(file);

        function confirmAddMcVersionFromSelect() {

        async function confirmAddCustomMcConfig() {
            const verInput = document.getElementById('mc-custom-ver-input');
            const nameInput = document.getElementById('mc-custom-name-input');
            const urlInput = document.getElementById('mc-custom-url-input');

            const verStr = verInput ? verInput.value.trim() : '';
            const labelStr = nameInput ? nameInput.value.trim() : '';
            const urlStr = urlInput ? urlInput.value.trim() : '';

            if (!verStr) {
                showNotification('入力エラー', 'ver名（例: 1.21.11）を入力してください。');
                return;
            }
            if (!urlStr && !mcPendingHtmlContent) {
                showNotification('入力エラー', 'リンクURLを入力するか、HTMLファイルを選択してください。');
                return;
            }

            const customId = 'custom_' + Date.now();
            const hasHtml = !!mcPendingHtmlContent;
            const newConfig = {
                id: customId,
                name: verStr,
                desc: labelStr || (mcPendingHtmlFileName ? `HTML: ${mcPendingHtmlFileName}` : 'カスタム構成'),
                url: urlStr || '',
                hasHtml: hasHtml,
                htmlContent: mcPendingHtmlContent || null,
                isCustom: true
            };

            if (hasHtml) {
                await saveMcHtmlToDb(customId, mcPendingHtmlContent);
            }

            mcCustomVersions.push(newConfig);
            mcAddedVersions.push(customId);
            mcSelectedVersionId = customId;
            mcShowAddConfigForm = false;
            mcPendingHtmlContent = null;
            mcPendingHtmlFileName = '';
            saveSystemState();
            showNotification('起動構成を追加', `Minecraft ${verStr} (${newConfig.desc}) を保存しました。`);
            switchMcTopTab('configs');
        }

        function handleMcSkinUpload(event) {

            const reader = new FileReader();
            reader.onload = (e) => {
                mcSkinDataUrl = e.target.result;
                updateMcAvatarUI();
                saveSystemState();
                switchMcTopTab('skins');
                showNotification('スキン変更', '新しいスキンを適用しました！');
            };
            reader.readAsDataURL(file);
        }

        function resetDefaultMcSkin() {
            mcSkinDataUrl = generateDefaultMcSkinDataUrl();
            updateMcAvatarUI();
            saveSystemState();
            switchMcTopTab('skins');
            showNotification('スキンリセット', '初期スキンに戻しました。');
        }

        // --- 3D Minecraft Skin Viewer (Three.js) ---
        let mcPlayerGroup = null;
        let mcTargetRotY = 0.4;
        let mcTargetRotX = 0.12;
        let mcWalkEnabled = true;

        function resetMcSkinRotation() {
            mcTargetRotY = 0;
            mcTargetRotX = 0;
        }

        function toggleMcSkinWalk() {
            mcWalkEnabled = !mcWalkEnabled;
            const btn = document.getElementById('mc-walk-btn');
            if (btn) btn.textContent = `モーション: ${mcWalkEnabled ? 'ON' : 'OFF'}`;
        }

        function initMcSkin3DViewer() {
            if (mc3dAnimId) {
                cancelAnimationFrame(mc3dAnimId);
                mc3dAnimId = null;
            }
            const container = document.getElementById('mc-skin-3d-container');
            if (!container || typeof THREE === 'undefined') return;
            container.innerHTML = '';

            const width = container.clientWidth || 280;
            const height = container.clientHeight || 240;

            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(40, width / height, 0.1, 1000);
            camera.position.set(0, 1.5, 38);

            const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(width, height);
            renderer.setPixelRatio(window.devicePixelRatio || 1);
            container.appendChild(renderer.domElement);

            const ambient = new THREE.AmbientLight(0xffffff, 0.85);
            scene.add(ambient);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.45);
            dirLight.position.set(15, 25, 25);
            scene.add(dirLight);

            const img = new Image();
            img.onload = () => {
                const skinCanvas = document.createElement('canvas');
                skinCanvas.width = 64;
                skinCanvas.height = 64;
                const sctx = skinCanvas.getContext('2d');
                sctx.imageSmoothingEnabled = false;
                sctx.drawImage(img, 0, 0, img.width, img.height, 0, 0, 64, img.height === 32 ? 32 : 64);

                if (img.height === 32) {
                    sctx.drawImage(skinCanvas, 0, 16, 16, 16, 16, 48, 16, 16);
                    sctx.drawImage(skinCanvas, 40, 16, 16, 16, 32, 48, 16, 16);
                }

                const tex = new THREE.CanvasTexture(skinCanvas);
                tex.magFilter = THREE.NearestFilter;
                tex.minFilter = THREE.NearestFilter;
                tex.needsUpdate = true;

                function createUVBox(w, h, d, uvMap) {
                    const geom = new THREE.BoxGeometry(w, h, d);
                    const uvAttr = geom.attributes.uv;
                    const faces = [uvMap.left, uvMap.right, uvMap.top, uvMap.bottom, uvMap.front, uvMap.back];
                    for (let f = 0; f < 6; f++) {
                        const [u1, v1, u2, v2] = faces[f];
                        const x1 = u1 / 64, x2 = u2 / 64;
                        const y1 = 1 - v2 / 64, y2 = 1 - v1 / 64;
                        const idx = f * 4;
                        uvAttr.setXY(idx + 0, x1, y2);
                        uvAttr.setXY(idx + 1, x2, y2);
                        uvAttr.setXY(idx + 2, x1, y1);
                        uvAttr.setXY(idx + 3, x2, y1);
                    }
                    uvAttr.needsUpdate = true;
                    const mat = new THREE.MeshLambertMaterial({ map: tex, transparent: true, alphaTest: 0.1 });
                    return new THREE.Mesh(geom, mat);
                }

                mcPlayerGroup = new THREE.Group();

                const head = createUVBox(8, 8, 8, {
                    right: [0, 8, 8, 16], front: [8, 8, 16, 16], left: [16, 8, 24, 16],
                    back: [24, 8, 32, 16], top: [8, 0, 16, 8], bottom: [16, 0, 24, 8]
                });
                head.position.set(0, 10, 0);
                mcPlayerGroup.add(head);

                const hat = createUVBox(8.6, 8.6, 8.6, {
                    right: [32, 8, 40, 16], front: [40, 8, 48, 16], left: [48, 8, 56, 16],
                    back: [56, 8, 64, 16], top: [40, 0, 48, 8], bottom: [48, 0, 56, 8]
                });
                hat.position.set(0, 10, 0);
                mcPlayerGroup.add(hat);

                const body = createUVBox(8, 12, 4, {
                    right: [16, 20, 20, 32], front: [20, 20, 28, 32], left: [28, 20, 32, 32],
                    back: [32, 20, 40, 32], top: [20, 16, 28, 20], bottom: [28, 16, 36, 20]
                });
                body.position.set(0, 0, 0);
                mcPlayerGroup.add(body);

                const jacket = createUVBox(8.4, 12.4, 4.4, {
                    right: [16, 36, 20, 48], front: [20, 36, 28, 48], left: [28, 36, 32, 48],
                    back: [32, 36, 40, 48], top: [20, 32, 28, 36], bottom: [28, 32, 36, 36]
                });
                jacket.position.set(0, 0, 0);
                mcPlayerGroup.add(jacket);

                const rightArm = createUVBox(4, 12, 4, {
                    right: [40, 20, 44, 32], front: [44, 20, 48, 32], left: [48, 20, 52, 32],
                    back: [52, 20, 56, 32], top: [44, 16, 48, 20], bottom: [48, 16, 52, 20]
                });
                rightArm.position.set(-6, 0, 0);
                mcPlayerGroup.add(rightArm);

                const rightSleeve = createUVBox(4.4, 12.4, 4.4, {
                    right: [40, 36, 44, 48], front: [44, 36, 48, 48], left: [48, 36, 52, 48],
                    back: [52, 36, 56, 48], top: [44, 32, 48, 36], bottom: [48, 32, 52, 36]
                });
                rightSleeve.position.set(-6, 0, 0);
                mcPlayerGroup.add(rightSleeve);

                const leftArm = createUVBox(4, 12, 4, {
                    right: [32, 52, 36, 64], front: [36, 52, 40, 64], left: [40, 52, 44, 64],
                    back: [44, 52, 48, 64], top: [36, 48, 40, 52], bottom: [40, 48, 44, 52]
                });
                leftArm.position.set(6, 0, 0);
                mcPlayerGroup.add(leftArm);

                const leftSleeve = createUVBox(4.4, 12.4, 4.4, {
                    right: [48, 52, 52, 64], front: [52, 52, 56, 64], left: [56, 52, 60, 64],
                    back: [60, 52, 64, 64], top: [52, 48, 56, 52], bottom: [56, 48, 60, 52]
                });
                leftSleeve.position.set(6, 0, 0);
                mcPlayerGroup.add(leftSleeve);

                const rightLeg = createUVBox(4, 12, 4, {
                    right: [0, 20, 4, 32], front: [4, 20, 8, 32], left: [8, 20, 12, 32],
                    back: [12, 20, 16, 32], top: [4, 16, 8, 20], bottom: [8, 16, 12, 20]
                });
                rightLeg.position.set(-2, -12, 0);
                mcPlayerGroup.add(rightLeg);

                const rightPants = createUVBox(4.4, 12.4, 4.4, {
                    right: [0, 36, 4, 48], front: [4, 36, 8, 48], left: [8, 36, 12, 48],
                    back: [12, 36, 16, 48], top: [4, 32, 8, 36], bottom: [8, 32, 12, 36]
                });
                rightPants.position.set(-2, -12, 0);
                mcPlayerGroup.add(rightPants);

                const leftLeg = createUVBox(4, 12, 4, {
                    right: [16, 52, 20, 64], front: [20, 52, 24, 64], left: [24, 52, 28, 64],
                    back: [28, 52, 32, 64], top: [20, 48, 24, 52], bottom: [24, 48, 28, 52]
                });
                leftLeg.position.set(2, -12, 0);
                mcPlayerGroup.add(leftLeg);

                const leftPants = createUVBox(4.4, 12.4, 4.4, {
                    right: [0, 52, 4, 64], front: [4, 52, 8, 64], left: [8, 52, 12, 64],
                    back: [12, 52, 16, 64], top: [4, 48, 8, 52], bottom: [8, 48, 12, 52]
                });
                leftPants.position.set(2, -12, 0);
                mcPlayerGroup.add(leftPants);

                scene.add(mcPlayerGroup);

                let isDraggingSkin = false;
                let prevX = 0, prevY = 0;

                const onDown = (clientX, clientY) => {
                    isDraggingSkin = true;
                    prevX = clientX;
                    prevY = clientY;
                };
                const onMove = (clientX, clientY) => {
                    if (!isDraggingSkin) return;
                    mcTargetRotY += (clientX - prevX) * 0.015;
                    mcTargetRotX = Math.max(-0.8, Math.min(0.8, mcTargetRotX + (clientY - prevY) * 0.015));
                    prevX = clientX;
                    prevY = clientY;
                };
                const onUp = () => { isDraggingSkin = false; };

                renderer.domElement.addEventListener('mousedown', e => onDown(e.clientX, e.clientY));
                window.addEventListener('mousemove', e => onMove(e.clientX, e.clientY));
                window.addEventListener('mouseup', onUp);

                renderer.domElement.addEventListener('touchstart', e => {
                    if (e.touches[0]) onDown(e.touches[0].clientX, e.touches[0].clientY);
                }, { passive: true });
                window.addEventListener('touchmove', e => {
                    if (e.touches[0]) onMove(e.touches[0].clientX, e.touches[0].clientY);
                }, { passive: true });
                window.addEventListener('touchend', onUp);

                let clockTime = 0;
                function animate() {
                    if (!document.getElementById('mc-skin-3d-container')) return;
                    mc3dAnimId = requestAnimationFrame(animate);
                    clockTime += 0.05;

                    mcPlayerGroup.rotation.y += (mcTargetRotY - mcPlayerGroup.rotation.y) * 0.15;
                    mcPlayerGroup.rotation.x += (mcTargetRotX - mcPlayerGroup.rotation.x) * 0.15;

                    if (mcWalkEnabled) {
                        const swing = Math.sin(clockTime) * 0.45;
                        rightArm.rotation.x = swing;
                        rightSleeve.rotation.x = swing;
                        leftArm.rotation.x = -swing;
                        leftSleeve.rotation.x = -swing;
                        rightLeg.rotation.x = -swing;
                        rightPants.rotation.x = -swing;
                        leftLeg.rotation.x = swing;
                        leftPants.rotation.x = swing;
                    } else {
                        rightArm.rotation.x = 0;
                        rightSleeve.rotation.x = 0;
                        leftArm.rotation.x = 0;
                        leftSleeve.rotation.x = 0;
                        rightLeg.rotation.x = 0;
                        rightPants.rotation.x = 0;
                        leftLeg.rotation.x = 0;
                        leftPants.rotation.x = 0;
                    }

                    renderer.render(scene, camera);
                }
                animate();
            };
            img.src = getMcSkinUrl();
        }

        function switchMcTopTab(tab) {
            const panel = document.getElementById('mc-main-panel');
            if (!panel) return;

            ['play', 'configs', 'skins'].forEach(t => {
                const btn = document.getElementById(`mc-top-${t}`);
                if (!btn) return;
                if (t === tab) {
                    btn.classList.add('border-emerald-500', 'text-white');
                    btn.classList.remove('border-transparent', 'text-slate-400');
                } else {
                    btn.classList.remove('border-emerald-500', 'text-white');
                    btn.classList.add('border-transparent', 'text-slate-400');
                }
            });

            if (mc3dAnimId && tab !== 'skins') {
                cancelAnimationFrame(mc3dAnimId);
                mc3dAnimId = null;
            }

            if (tab === 'play') {
                panel.innerHTML = renderMcPlayTabHTML();
            } else if (tab === 'configs') {
                panel.innerHTML = renderMcConfigsTabHTML();
            } else if (tab === 'skins') {
                panel.innerHTML = renderMcSkinsTabHTML();
                setTimeout(initMcSkin3DViewer, 20);
            } else if (tab === 'settings') {
                panel.innerHTML = renderMcSettingsTabHTML();
            }
        }

        // --- Google Chrome Multi-Tab Browser ---
        let edgeTabs = [];
        let activeEdgeTabId = null;
        let edgeTabSeq = 1;

        function initEdgeTabs() {
            edgeTabs = [];
            activeEdgeTabId = null;
            edgeTabSeq = 1;
            openEdgeNewTab(CHROME_HOME_URL, '新しいタブ');
        }

        function openEdgeNewTab(url = CHROME_HOME_URL, title = '新しいタブ') {
            const container = document.getElementById('edge-frames-container');
            if (!container) return;

            const tabId = 'edge-tab-' + (edgeTabSeq++);
            edgeTabs.push({ id: tabId, title: title, url: url });

            const frameWrap = document.createElement('div');
            frameWrap.id = `wrap-${tabId}`;
            frameWrap.className = 'w-full h-full flex flex-col';
            frameWrap.innerHTML = `
                <iframe id="iframe-${tabId}" src="${url}" class="w-full flex-1 border-0 bg-white" allow="fullscreen; geolocation; microphone; camera; clipboard-read; clipboard-write" referrerpolicy="no-referrer-when-downgrade"></iframe>
            `;
            container.appendChild(frameWrap);

            const iframeEl = frameWrap.querySelector('iframe');
            iframeEl.addEventListener('load', () => {
                try {
                    const win = iframeEl.contentWindow;
                    if (win) {
                        win.open = function(newUrl) {
                            if (newUrl) openEdgeNewTab(newUrl, newUrl);
                            return null;
                        };
                        const doc = iframeEl.contentDocument;
                        if (doc) {
                            const tabObj = edgeTabs.find(t => t.id === tabId);
                            if (tabObj && doc.title) {
                                tabObj.title = doc.title;
                                renderEdgeTabsBar();
                            }
                            doc.querySelectorAll('a[target="_blank"]').forEach(a => {
                                a.addEventListener('click', (ev) => {
                                    ev.preventDefault();
                                    if (a.href) openEdgeNewTab(a.href, a.textContent.trim() || a.href);
                                });
                            });
                        }
                    }
                } catch (e) {}
            });

            switchEdgeTab(tabId);
        }

        function switchEdgeTab(tabId) {
            activeEdgeTabId = tabId;
            edgeTabs.forEach(t => {
                const wrap = document.getElementById(`wrap-${t.id}`);
                if (wrap) {
                    wrap.style.display = (t.id === tabId) ? 'flex' : 'none';
                }
            });
            const current = edgeTabs.find(t => t.id === tabId);
            const urlInput = document.getElementById('edge-url');
            if (current && urlInput) {
                urlInput.value = current.url;
            }
            renderEdgeTabsBar();
        }

        function closeEdgeTab(e, tabId) {
            if (e) e.stopPropagation();
            if (edgeTabs.length <= 1) {
                closeWindow('browser');
                return;
            }
            const idx = edgeTabs.findIndex(t => t.id === tabId);
            if (idx === -1) return;
            edgeTabs.splice(idx, 1);
            const wrap = document.getElementById(`wrap-${tabId}`);
            if (wrap) {
                wrap.querySelectorAll('iframe').forEach(ifr => {
                    try { ifr.src = 'about:blank'; } catch {}
                    ifr.remove();
                });
                wrap.remove();
            }

            if (activeEdgeTabId === tabId) {
                const nextTab = edgeTabs[Math.max(0, idx - 1)];
                switchEdgeTab(nextTab.id);
            } else {
                renderEdgeTabsBar();
            }
        }

        function renderEdgeTabsBar() {
            const bar = document.getElementById('edge-tabs-bar');
            if (!bar) return;
            bar.innerHTML = edgeTabs.map(t => {
                const isActive = t.id === activeEdgeTabId;
                return `
                    <div onclick="switchEdgeTab('${t.id}')" class="group flex items-center gap-2 px-3 py-1.5 rounded-t-lg text-xs cursor-pointer min-w-[110px] max-w-[190px] transition ${isActive ? 'bg-white text-slate-900 font-semibold shadow-xs' : 'bg-transparent text-slate-600 hover:bg-white/50'}">
                        <img src="${CHROME_ICON_URL}" onerror="this.onerror=null;this.src='https://placehold.co/16x16/2563eb/ffffff?text=C';" class="w-4 h-4 rounded-full object-contain shrink-0" alt="">
                        <span class="truncate flex-1">${t.title}</span>
                        <button onclick="closeEdgeTab(event, '${t.id}')" title="タブを閉じる (Ctrl+W)" class="p-0.5 rounded-full hover:bg-black/10 opacity-70 group-hover:opacity-100">
                            <i class="ph ph-x text-[10px]"></i>
                        </button>
                    </div>
                `;
            }).join('') + `
                <button onclick="openEdgeNewTab(CHROME_HOME_URL, '新しいタブ')" title="新しいタブ (Ctrl+T)" class="p-1.5 mb-0.5 rounded-full hover:bg-black/10 text-slate-700 transition shrink-0">
                    <i class="ph-bold ph-plus text-xs"></i>
                </button>
            `;
        }

        function navigateEdgeHome() {
            const current = edgeTabs.find(t => t.id === activeEdgeTabId);
            if (current) {
                current.url = CHROME_HOME_URL;
                current.title = '新しいタブ';
                const iframe = document.getElementById(`iframe-${current.id}`);
                if (iframe) iframe.src = CHROME_HOME_URL;
                const urlInput = document.getElementById('edge-url');
                if (urlInput) urlInput.value = CHROME_HOME_URL;
                renderEdgeTabsBar();
            } else {
                openEdgeNewTab(CHROME_HOME_URL, '新しいタブ');
            }
        }

        function reloadActiveEdgeTab() {
            const current = edgeTabs.find(t => t.id === activeEdgeTabId);
            const iframe = document.getElementById(`iframe-${activeEdgeTabId}`);
            if (current && iframe) {
                iframe.src = current.url;
            }
        }

        function searchEdge(rawInput) {
            const q = (rawInput || '').trim();
            if (!q) return;

            let targetUrl = '';
            let tabTitle = q;
            if (/^https?:\/\//i.test(q) || (/^[a-zA-Z0-9-]+\.[a-zA-Z]{2,}/.test(q) && !q.includes(' '))) {
                targetUrl = /^https?:\/\//i.test(q) ? q : `https://${q}`;
            } else {
                targetUrl = `${CHROME_HOME_URL}?q=${encodeURIComponent(q)}`;
                tabTitle = `${q} - 検索`;
            }

            const current = edgeTabs.find(t => t.id === activeEdgeTabId);
            if (!current) {
                openEdgeNewTab(targetUrl, tabTitle);
                return;
            }

            if (current.url === CHROME_HOME_URL && targetUrl !== CHROME_HOME_URL) {
                openEdgeNewTab(targetUrl, tabTitle);
            } else {
                current.url = targetUrl;
                current.title = tabTitle;
                const iframe = document.getElementById(`iframe-${current.id}`);
                if (iframe) iframe.src = targetUrl;
                const urlInput = document.getElementById('edge-url');
                if (urlInput) urlInput.value = targetUrl;
                renderEdgeTabsBar();
            }
        }

        function launchMinecraftGame() {
            const allVers = getAllAvailableMcVersions();
            const ver = allVers.find(v => v.id === mcSelectedVersionId) || allVers[0];
            const windowTitle = `Minecraft ${ver.name}`;
            showNotification('Minecraft', `${windowTitle} を軽量モードで起動しています...`);

            const perfInjectScript = `
                <script>
                    (function() {
                        try {
                            if (!localStorage.getItem('_eagler_perf_applied')) {
                                window.eaglercraftXOpts = Object.assign({
                                    allowUpdateSvc: false,
                                    allowUpdateDL: false,
                                    checkRelaysForUpdates: false,
                                    enableDownloadOfflineButton: false,
                                    html5Cursor: true
                                }, window.eaglercraftXOpts || {});
                                localStorage.setItem('_eagler_perf_applied', '1');
                            }
                            Object.defineProperty(window, 'devicePixelRatio', { get: function() { return 1; } });
                        } catch (e) {}
                    })();
                <\/script>
            `;

            if (ver.htmlContent) {
                const safeId = 'web_mc_html_' + ver.id.replace(/[^a-zA-Z0-9]/g, '');
                let optimizedHtml = ver.htmlContent;
                if (/<head[^>]*>/i.test(optimizedHtml)) {
                    optimizedHtml = optimizedHtml.replace(/<head[^>]*>/i, match => `${match}\n${perfInjectScript}`);
                } else {
                    optimizedHtml = `${perfInjectScript}\n${optimizedHtml}`;
                }

                appsConfig[safeId] = {
                    title: windowTitle,
                    icon: 'ph-fill ph-cube text-emerald-600',
                    iconImg: MC_GRASS_ICON_URL,
                    aspectLock: true,
                    width: 840,
                    height: 540,
                    render: () => `
                        <div class="flex flex-col h-full bg-black text-white">
                            <div class="relative flex-1 bg-black">
                                <iframe id="iframe-${safeId}" class="w-full h-full border-0" loading="eager" importance="high" allow="fullscreen; autoplay; gamepad; cross-origin-isolated" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-pointer-lock"></iframe>
                            </div>
                        </div>
                    `
                };
                openApp(safeId);
                setTimeout(() => {
                    const ifr = document.getElementById(`iframe-${safeId}`);
                    if (ifr) ifr.srcdoc = optimizedHtml;
                }, 20);
            } else {
                let targetUrl = ver.url;
                if (targetUrl && !targetUrl.includes('noUpdate')) {
                    targetUrl += (targetUrl.includes('?') ? '&' : '?') + 'noUpdate=1';
                }
                openWebFrame(windowTitle, targetUrl, MC_GRASS_ICON_URL, true);
            }
        }

        // --- Window Management ---
        function openApp(appId) {
            const config = appsConfig[appId];
            if (!config) return;

            if (openWindows[appId]) {
                const win = openWindows[appId];
                win.classList.remove('minimized');
                focusWindow(appId);
                return;
            }

            const container = document.getElementById('windows-container');
            const win = document.createElement('div');
            win.id = `win-${appId}`;
            win.className = 'win-window mica-light pointer-events-auto';

            const offset = Object.keys(openWindows).length * 26;
            const initW = Math.min(config.width, window.innerWidth - 20);
            const initH = Math.min(config.height, window.innerHeight - 70);
            const startX = Math.max(10, Math.min(80 + offset, window.innerWidth - initW - 20));
            const startY = Math.max(10, Math.min(50 + offset, window.innerHeight - initH - 60));

            win.style.left = `${startX}px`;
            win.style.top = `${startY}px`;
            win.style.width = `${initW}px`;
            win.style.height = `${initH}px`;

            const resizeHandlesHTML = config.aspectLock ? `
                <div class="win-resize-handle win-resize-nw" onmousedown="startResize(event, '${appId}', 'nw')" ontouchstart="startResize(event, '${appId}', 'nw')"></div>
                <div class="win-resize-handle win-resize-ne" onmousedown="startResize(event, '${appId}', 'ne')" ontouchstart="startResize(event, '${appId}', 'ne')"></div>
                <div class="win-resize-handle win-resize-sw" onmousedown="startResize(event, '${appId}', 'sw')" ontouchstart="startResize(event, '${appId}', 'sw')"></div>
                <div class="win-resize-handle win-resize-se" onmousedown="startResize(event, '${appId}', 'se')" ontouchstart="startResize(event, '${appId}', 'se')"></div>
            ` : `
                <div class="win-resize-handle win-resize-n" onmousedown="startResize(event, '${appId}', 'n')" ontouchstart="startResize(event, '${appId}', 'n')"></div>
                <div class="win-resize-handle win-resize-s" onmousedown="startResize(event, '${appId}', 's')" ontouchstart="startResize(event, '${appId}', 's')"></div>
                <div class="win-resize-handle win-resize-w" onmousedown="startResize(event, '${appId}', 'w')" ontouchstart="startResize(event, '${appId}', 'w')"></div>
                <div class="win-resize-handle win-resize-e" onmousedown="startResize(event, '${appId}', 'e')" ontouchstart="startResize(event, '${appId}', 'e')"></div>
                <div class="win-resize-handle win-resize-nw" onmousedown="startResize(event, '${appId}', 'nw')" ontouchstart="startResize(event, '${appId}', 'nw')"></div>
                <div class="win-resize-handle win-resize-ne" onmousedown="startResize(event, '${appId}', 'ne')" ontouchstart="startResize(event, '${appId}', 'ne')"></div>
                <div class="win-resize-handle win-resize-sw" onmousedown="startResize(event, '${appId}', 'sw')" ontouchstart="startResize(event, '${appId}', 'sw')"></div>
                <div class="win-resize-handle win-resize-se" onmousedown="startResize(event, '${appId}', 'se')" ontouchstart="startResize(event, '${appId}', 'se')"></div>
            `;

            win.innerHTML = (config.customChrome ? `
                <div class="flex-1 overflow-hidden relative flex flex-col" onmousedown="focusWindow('${appId}')">
                    ${config.render()}
                </div>
            ` : `
                <div class="win-titlebar h-9 px-3 flex items-center justify-between bg-white/60 border-b border-black/5 cursor-move" onmousedown="startDrag(event, '${appId}')" ontouchstart="startDrag(event, '${appId}')">
                    <div class="flex items-center gap-2 text-xs font-medium text-slate-800 pointer-events-none">
                        ${config.iconImg
                            ? `<img src="${config.iconImg}" onerror="this.onerror=null;this.src='${appId === 'minecraft' ? MC_ICON_FALLBACK : MC_GRASS_FALLBACK}';" class="w-5 h-5 rounded object-cover" alt="">`
                            : `<i class="${config.icon} text-base"></i>`
                        }
                        <span>${config.title}</span>
                    </div>
                    <div class="flex items-center gap-1">
                        <button onclick="minimizeWindow('${appId}')" title="最小化" class="w-8 h-7 rounded hover:bg-black/10 flex items-center justify-center text-slate-700 transition">
                            <i class="ph ph-minus text-xs"></i>
                        </button>
                        <button onclick="maximizeWindow('${appId}')" title="最大化" class="w-8 h-7 rounded hover:bg-black/10 flex items-center justify-center text-slate-700 transition">
                            <i class="ph ph-square text-xs"></i>
                        </button>
                        <button onclick="closeWindow('${appId}')" title="閉じる" class="w-8 h-7 rounded hover:bg-red-500 hover:text-white flex items-center justify-center text-slate-700 transition">
                            <i class="ph ph-x text-xs"></i>
                        </button>
                    </div>
                </div>
                <div class="flex-1 overflow-hidden relative" onmousedown="focusWindow('${appId}')">
                    ${config.render()}
                </div>
            `) + resizeHandlesHTML;

            container.appendChild(win);
            openWindows[appId] = win;
            renderTaskbarApps();
            focusWindow(appId);
            refreshShadowCaptureUI();
        }

        // --- Window Resizing ---
        function startResize(e, appId, dir) {
            e.preventDefault();
            e.stopPropagation();
            const win = openWindows[appId];
            const config = appsConfig[appId];
            if (!win || !config || win.classList.contains('maximized')) return;

            focusWindow(appId);
            win.classList.add('dragging');

            const startX = e.touches ? e.touches[0].clientX : e.clientX;
            const startY = e.touches ? e.touches[0].clientY : e.clientY;
            const rect = win.getBoundingClientRect();
            const startLeft = rect.left;
            const startTop = rect.top;
            const startWidth = rect.width;
            const startHeight = rect.height;
            const aspectRatio = startWidth / Math.max(1, startHeight);
            const minW = 280;
            const minH = 200;

            win.querySelectorAll('iframe').forEach(ifr => ifr.style.pointerEvents = 'none');

            function onMove(ev) {
                const cx = ev.touches ? ev.touches[0].clientX : ev.clientX;
                const cy = ev.touches ? ev.touches[0].clientY : ev.clientY;
                const dx = cx - startX;
                const dy = cy - startY;

                let newW = startWidth;
                let newH = startHeight;
                let newLeft = startLeft;
                let newTop = startTop;

                if (config.aspectLock) {
                    const signX = dir.includes('e') ? 1 : -1;
                    const signY = dir.includes('s') ? 1 : -1;
                    const delta = Math.abs(dx) > Math.abs(dy * aspectRatio) ? dx * signX : (dy * signY) * aspectRatio;

                    newW = Math.max(minW, Math.min(window.innerWidth - 16, startWidth + delta));
                    newH = newW / aspectRatio;
                    if (newH > window.innerHeight - 56) {
                        newH = window.innerHeight - 56;
                        newW = newH * aspectRatio;
                    }
                    if (dir.includes('w')) newLeft = startLeft + (startWidth - newW);
                    if (dir.includes('n')) newTop = Math.max(0, startTop + (startHeight - newH));
                } else {
                    if (dir.includes('e')) {
                        newW = Math.max(minW, Math.min(window.innerWidth - startLeft, startWidth + dx));
                    }
                    if (dir.includes('s')) {
                        newH = Math.max(minH, Math.min(window.innerHeight - 48 - startTop, startHeight + dy));
                    }
                    if (dir.includes('w')) {
                        const proposedW = startWidth - dx;
                        if (proposedW >= minW && startLeft + dx >= 0) {
                            newW = proposedW;
                            newLeft = startLeft + dx;
                        }
                    }
                    if (dir.includes('n')) {
                        const proposedH = startHeight - dy;
                        if (proposedH >= minH && startTop + dy >= 0) {
                            newH = proposedH;
                            newTop = startTop + dy;
                        }
                    }
                }

                win.style.width = `${newW}px`;
                win.style.height = `${newH}px`;
                win.style.left = `${newLeft}px`;
                win.style.top = `${newTop}px`;
            }

            function onEnd() {
                win.classList.remove('dragging');
                win.querySelectorAll('iframe').forEach(ifr => ifr.style.pointerEvents = '');
                document.removeEventListener('mousemove', onMove);
                document.removeEventListener('mouseup', onEnd);
                document.removeEventListener('touchmove', onMove);
                document.removeEventListener('touchend', onEnd);
            }

            document.addEventListener('mousemove', onMove);
            document.addEventListener('mouseup', onEnd);
            document.addEventListener('touchmove', onMove, { passive: false });
            document.addEventListener('touchend', onEnd);
        }

        // --- Keyboard Shortcuts (Ctrl+W, Ctrl+T, Alt+F10 Instant Replay) ---
        document.addEventListener('keydown', (e) => {
            if (e.altKey && e.key === 'F10') {
                e.preventDefault();
                saveShadowInstantReplay('Alt+F10 インスタントリプレイ');
                return;
            }

            if ((e.ctrlKey || e.metaKey || e.altKey) && e.key.toLowerCase() === 'w') {
                if (activeAppId === 'browser' && openWindows['browser'] && !openWindows['browser'].classList.contains('minimized')) {
                    e.preventDefault();
                    if (activeEdgeTabId) {
                        closeEdgeTab(null, activeEdgeTabId);
                    }
                    return;
                } else if (activeAppId && openWindows[activeAppId]) {
                    e.preventDefault();
                    closeWindow(activeAppId);
                    return;
                }
            }

            if ((e.ctrlKey || e.metaKey || e.altKey) && e.key.toLowerCase() === 't') {
                if (activeAppId === 'browser' && openWindows['browser']) {
                    e.preventDefault();
                    openEdgeNewTab(CHROME_HOME_URL, '新しいタブ');
                    return;
                }
            }
        });

        function focusWindow(appId) {
            const win = openWindows[appId];
            if (win) {
                activeAppId = appId;
                win.style.zIndex = ++zIndexCounter;
                renderTaskbarApps();
            }
        }

        function minimizeWindow(appId) {
            const win = openWindows[appId];
            if (win) {
                win.classList.add('minimized');
                if (activeAppId === appId) {
                    activeAppId = null;
                }
                renderTaskbarApps();
            }
        }

        function minimizeAllWindows() {
            Object.keys(openWindows).forEach(id => {
                const win = openWindows[id];
                if (win) win.classList.add('minimized');
            });
            activeAppId = null;
            renderTaskbarApps();
        }

        function maximizeWindow(appId) {
            const win = openWindows[appId];
            if (win) win.classList.toggle('maximized');
        }

        function closeWindow(appId) {
            const win = openWindows[appId];
            if (win) {
                win.querySelectorAll('iframe').forEach(ifr => {
                    try { ifr.src = 'about:blank'; } catch {}
                    ifr.remove();
                });
                win.remove();
                delete openWindows[appId];

                if (appId === 'browser') {
                    edgeTabs = [];
                    activeEdgeTabId = null;
                }
                if (appId === 'minecraft' && mc3dAnimId) {
                    cancelAnimationFrame(mc3dAnimId);
                    mc3dAnimId = null;
                }
                if (appId.startsWith('web_')) {
                    delete appsConfig[appId];
                }
                if (activeAppId === appId) {
                    activeAppId = null;
                }
                renderTaskbarApps();
                refreshShadowCaptureUI();
            }
        }

        function addTaskbarIcon(appId, config) {
            renderTaskbarApps();
        }

        // --- Dragging Logic (Mouse & Touch) ---
        function startDrag(e, appId) {
            if (e.target.closest('button')) return;
            const win = openWindows[appId];
            if (!win || win.classList.contains('maximized')) return;

            focusWindow(appId);
            win.classList.add('dragging');

            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const rect = win.getBoundingClientRect();
            const offsetX = clientX - rect.left;
            const offsetY = clientY - rect.top;

            function onMove(ev) {
                const cx = ev.touches ? ev.touches[0].clientX : ev.clientX;
                const cy = ev.touches ? ev.touches[0].clientY : ev.clientY;
                const newX = Math.max(-rect.width + 80, Math.min(window.innerWidth - 80, cx - offsetX));
                const newY = Math.max(0, Math.min(window.innerHeight - 60, cy - offsetY));
                win.style.left = `${newX}px`;
                win.style.top = `${newY}px`;
            }

            function onEnd() {
                win.classList.remove('dragging');
                document.removeEventListener('mousemove', onMove);
                document.removeEventListener('mouseup', onEnd);
                document.removeEventListener('touchmove', onMove);
                document.removeEventListener('touchend', onEnd);
            }

            document.addEventListener('mousemove', onMove);
            document.addEventListener('mouseup', onEnd);
            document.addEventListener('touchmove', onMove, { passive: false });
            document.addEventListener('touchend', onEnd);
        }

        // --- Calculator Logic ---
        function calcInput(val) {
            const display = document.getElementById('calc-display');
            const history = document.getElementById('calc-history');
            if (!display) return;

            if (val === 'C') {
                calcExpression = '';
                display.textContent = '0';
                history.textContent = '';
            } else if (val === 'DEL') {
                calcExpression = calcExpression.slice(0, -1);
                display.textContent = calcExpression || '0';
            } else if (val === '=') {
                try {
                    const sanitized = calcExpression.replace(/[^0-9+\-*/.%]/g, '');
                    if (!sanitized) return;
                    const result = Function('"use strict";return (' + sanitized + ')')();
                    history.textContent = calcExpression + ' =';
                    calcExpression = String(Number.isFinite(result) ? Number(result.toFixed(8)) : 'エラー');
                    display.textContent = calcExpression;
                } catch {
                    display.textContent = 'エラー';
                    calcExpression = '';
                }
            } else {
                calcExpression += val;
                display.textContent = calcExpression;
            }
        }

        // --- Terminal Logic ---
        function handleTerminal(e) {
            if (e.key !== 'Enter') return;
            const input = e.target;
            const cmd = input.value.trim();
            const output = document.getElementById('term-output');

            const line = document.createElement('div');
            line.innerHTML = `<span class="text-white">PS C:\\Users\\User&gt;</span> ${cmd}`;
            output.appendChild(line);

            const resp = document.createElement('div');
            resp.className = 'text-slate-300 mb-2';

            const lower = cmd.toLowerCase();
            if (lower === 'help') {
                resp.textContent = '使用可能なコマンド:\n  help      - コマンド一覧を表示\n  cls       - 画面をクリア\n  date      - 現在の日時を表示\n  ver       - OSバージョンを表示\n  replay    - ShadowCapture 過去2分リプレイを保存\n  notepad   - メモ帳を起動';
            } else if (lower === 'cls' || lower === 'clear') {
                output.innerHTML = '';
                input.value = '';
                return;
            } else if (lower === 'date') {
                resp.textContent = new Date().toString();
            } else if (lower === 'ver') {
                resp.textContent = 'Windows 11 Web Simulator [Version 24H2 Build 26100]';
            } else if (lower === 'replay') {
                saveShadowInstantReplay('ターミナル リプレイ保存');
                resp.textContent = 'ShadowCapture Pro: リプレイを保存しました。';
            } else if (lower === 'notepad') {
                openApp('notepad');
                resp.textContent = 'メモ帳を起動しました...';
            } else if (cmd !== '') {
                resp.textContent = `'${cmd}' は、内部コマンドまたは外部コマンドとして認識されていません。`;
            }

            output.appendChild(resp);
            input.value = '';
            output.parentElement.scrollTop = output.parentElement.scrollHeight;
        }

        // --- Initialize Saved State on Load ---
        loadSystemState();
    </script>
